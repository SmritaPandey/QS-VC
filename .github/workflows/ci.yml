name: QS-VC CI

# Pushes to main run this through "QSVC Production Deployment" (workflow_call), so main is
# checked exactly once per push. Other branches and pull requests trigger it directly.
on:
  workflow_call:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: qsvc-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Root devDependency used only for local document export; never needed in CI.
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  NODE_VERSION: 22

jobs:
  # ── Fast checks: run in parallel, no npm install needed ─────────────────────
  security:
    name: Security evidence and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate deployment security evidence and findings
        run: node --test security/check.test.cjs && node security/check.cjs
      # Audits read the lockfiles only; installing packages first is unnecessary.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --package-lock-only
      - name: Audit Poly bridge dependencies
        run: npm --prefix deploy/poly-bridge audit --omit=dev --audit-level=high --package-lock-only

  # ── Tests and builds share one cached install ───────────────────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Restore node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            services/*/node_modules
            frontend/web/node_modules
          key: modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Run tests
        run: npx vitest run

  build:
    name: Type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            deploy/poly-bridge/package-lock.json
      - name: Restore node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            services/*/node_modules
            frontend/web/node_modules
          key: modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Build all services
        run: npm run build
      - name: Type-check Poly bridge
        run: |
          npm --prefix deploy/poly-bridge ci --ignore-scripts
          npm --prefix deploy/poly-bridge run typecheck

  # ── Container images: one parallel job per image, layer cache, cached scan DB ─
  docker:
    name: Image ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: sfu, context: services/sfu, file: services/sfu/Dockerfile }
          - { image: signaling, context: ., file: services/signaling/Dockerfile }
          - { image: auth, context: ., file: services/auth/Dockerfile }
          - { image: meeting, context: ., file: services/meeting/Dockerfile }
          - { image: recording, context: ., file: services/recording/Dockerfile }
          - { image: web, context: ., file: frontend/web/Dockerfile }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: qsvc-${{ matrix.image }}:latest
          # Unchanged layers (npm installs, the mediasoup worker) come from the cache.
          cache-from: type=gha,scope=qsvc-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=qsvc-${{ matrix.image }}
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: qsvc-${{ matrix.image }}:latest
          format: cyclonedx-json
          output-file: qsvc-${{ matrix.image }}.cdx.json
          artifact-name: qsvc-${{ matrix.image }}.cdx.json
      - name: Scan SBOM
        uses: anchore/scan-action@v7
        with:
          sbom: qsvc-${{ matrix.image }}.cdx.json
          fail-build: true
          severity-cutoff: high
          # Fail on high/critical findings that have a published fix; unfixed OS CVEs are tracked in the SBOM.
          only-fixed: true
          # Reuse the vulnerability database between runs instead of downloading it per image.
          cache-db: true
