# Linux AWS host only. Windows intranet uses its own local deployment.
x-app: &app
  image: qsvc-demo:local
  network_mode: host
  restart: unless-stopped
  working_dir: /opt/qsvc
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
x-runtime: &runtime
  NODE_ENV: production
  WEB_URL: ${WEB_URL:?Set the public Cloudflare website URL}
  CORS_ORIGINS: ${CORS_ORIGINS:?Set allowed public website origins}
  POSTGRES_SSL: verify-full
  POSTGRES_CA_FILE: /opt/qsvc/certs/rds-ca.pem
  AUTH_INTERNAL_URL: http://127.0.0.1:4002
  MEETING_INTERNAL_URL: http://127.0.0.1:4003
  SFU_INTERNAL_URL: http://127.0.0.1:4000
  SFU_ANNOUNCED_IP: ${SFU_ANNOUNCED_IP:?Set the public media IP}
  SFU_NUM_WORKERS: '1'
  SFU_MIN_PORT: '40000'
  SFU_MAX_PORT: '40100'
  TURN_SERVERS: ${TURN_SERVERS}
  # Time-limited TURN credentials (coturn REST API). Falls back to the old TURN_PASSWORD value so
  # existing servers keep working; set a dedicated TURN_SECRET in .env when convenient.
  TURN_SECRET: ${TURN_SECRET:?Set a private shared TURN secret}
services:
  keycloak-db:
    extends: { file: ../keycloak/compose.yml, service: keycloak-db }
    volumes:
      - keycloak-data:/var/lib/postgresql/data
      - ../keycloak/init-db.sql:/docker-entrypoint-initdb.d/01-keycloak.sql:ro
  keycloak:
    extends: { file: ../keycloak/compose.yml, service: keycloak }
    environment:
      QSVC_SSO_AUTH_URL: ${QSVC_SSO_AUTH_URL:-http://localhost:4002}
    volumes:
      - ../keycloak/qsvc-realm.json:/opt/keycloak/data/import/qsvc-realm.json:ro
    networks: [default, keycloak-db]
  auth:
    secrets: [session_signing_key]
    <<: *app
    build:
      context: ../..
      dockerfile: deploy/aws/Dockerfile
      target: build
    environment:
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:-}
      TURN_ACCESS_SECRET: ${TURN_ACCESS_SECRET:-}
      SESSION_SIGNING_KEY_FILE: /run/secrets/session_signing_key
      QSVC_SSO_ENABLED: ${QSVC_SSO_ENABLED:-false}
      QSVC_SSO_AUTH_URL: ${QSVC_SSO_AUTH_URL:-http://localhost:4002}
      QSVC_SSO_WEB_URL: ${QSVC_SSO_WEB_URL:-http://localhost:5173}
      QSVC_KEYCLOAK_ISSUER: ${QSVC_KEYCLOAK_ISSUER:-http://localhost:8085/realms/qsvc}
      QSVC_KEYCLOAK_INTERNAL_URL: ${QSVC_KEYCLOAK_INTERNAL_URL:-http://127.0.0.1:8085}
      QSVC_KEYCLOAK_CLIENT_SECRET: ${QSVC_KEYCLOAK_CLIENT_SECRET:-}
      QSVC_KEYCLOAK_ADMIN_CLIENT_ID: ${QSVC_KEYCLOAK_ADMIN_CLIENT_ID:-qsvc-idp-admin}
      QSVC_KEYCLOAK_ADMIN_CLIENT_SECRET: ${QSVC_KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      QSVC_SSO_IDP_HOSTS: ${QSVC_SSO_IDP_HOSTS:-}
      QSVC_DIGILOCKER_ENABLED: ${QSVC_DIGILOCKER_ENABLED:-false}
      QSVC_DIGILOCKER_AUTHORIZE_URL: ${QSVC_DIGILOCKER_AUTHORIZE_URL:-}
      QSVC_DIGILOCKER_TOKEN_URL: ${QSVC_DIGILOCKER_TOKEN_URL:-}
      QSVC_DIGILOCKER_USER_URL: ${QSVC_DIGILOCKER_USER_URL:-}
      QSVC_DIGILOCKER_CLIENT_ID: ${QSVC_DIGILOCKER_CLIENT_ID:-}
      QSVC_DIGILOCKER_CLIENT_SECRET: ${QSVC_DIGILOCKER_CLIENT_SECRET:-}
      QSVC_DIGILOCKER_SCOPE: ${QSVC_DIGILOCKER_SCOPE:-}
      QSVC_GOOGLE_CLIENT_ID: ${QSVC_GOOGLE_CLIENT_ID:-}
      QSVC_GOOGLE_CLIENT_SECRET: ${QSVC_GOOGLE_CLIENT_SECRET:-}
      QSVC_MICROSOFT_CLIENT_ID: ${QSVC_MICROSOFT_CLIENT_ID:-}
      QSVC_MICROSOFT_CLIENT_SECRET: ${QSVC_MICROSOFT_CLIENT_SECRET:-}
      QSVC_EMAIL_API_KEY: ${QSVC_EMAIL_API_KEY:-}
      QSVC_EMAIL_FROM: ${QSVC_EMAIL_FROM:-}
      QSVC_ENTERPRISE_TERMS_REQUIRED: ${QSVC_ENTERPRISE_TERMS_REQUIRED:-no}
      <<: *runtime
      DATABASE_URL: ${AUTH_DATABASE_URL:?Set the restricted auth database URL}
      ENTERPRISE_ACCESS_JSON: '${ENTERPRISE_ACCESS_JSON:-[]}'
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      PAYMENT_TERMS_CONFIRMED: ${PAYMENT_TERMS_CONFIRMED:-false}
      PAYMENT_RETURN_URL: ${PAYMENT_RETURN_URL:-https://qsvcmeet.com}
      AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-https://backend.qsvcmeet.com}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_PLAN_STARTER: ${RAZORPAY_PLAN_STARTER:-}
      RAZORPAY_PLAN_PRO: ${RAZORPAY_PLAN_PRO:-}
      PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT:-sandbox}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_PLAN_STARTER: ${PAYPAL_PLAN_STARTER:-}
      PAYPAL_PLAN_PRO: ${PAYPAL_PLAN_PRO:-}
      PAYPAL_CURRENCY: ${PAYPAL_CURRENCY:-USD}
      PAYPAL_STARTER_BASE_AMOUNT: ${PAYPAL_STARTER_BASE_AMOUNT:-}
      PAYPAL_PRO_BASE_AMOUNT: ${PAYPAL_PRO_BASE_AMOUNT:-}
      RAZORPAY_PLAN_BASIC: ${RAZORPAY_PLAN_BASIC:-}
      PAYPAL_PLAN_BASIC: ${PAYPAL_PLAN_BASIC:-}
      PAYPAL_PLAN_BASIC_TRIAL_14: ${PAYPAL_PLAN_BASIC_TRIAL_14:-}
      PAYPAL_BASIC_BASE_AMOUNT: ${PAYPAL_BASIC_BASE_AMOUNT:-}
      RAZORPAY_PLAN_BASIC_ANNUAL: ${RAZORPAY_PLAN_BASIC_ANNUAL:-}
      PAYPAL_PLAN_BASIC_ANNUAL: ${PAYPAL_PLAN_BASIC_ANNUAL:-}
      PAYPAL_PLAN_BASIC_ANNUAL_TRIAL_14: ${PAYPAL_PLAN_BASIC_ANNUAL_TRIAL_14:-}
      PAYPAL_BASIC_ANNUAL_BASE_AMOUNT: ${PAYPAL_BASIC_ANNUAL_BASE_AMOUNT:-}
      PAYPAL_PLAN_STARTER_TRIAL_14: ${PAYPAL_PLAN_STARTER_TRIAL_14:-}
      RAZORPAY_PLAN_STARTER_ANNUAL: ${RAZORPAY_PLAN_STARTER_ANNUAL:-}
      PAYPAL_PLAN_STARTER_ANNUAL: ${PAYPAL_PLAN_STARTER_ANNUAL:-}
      PAYPAL_PLAN_STARTER_ANNUAL_TRIAL_14: ${PAYPAL_PLAN_STARTER_ANNUAL_TRIAL_14:-}
      PAYPAL_STARTER_ANNUAL_BASE_AMOUNT: ${PAYPAL_STARTER_ANNUAL_BASE_AMOUNT:-}
      PAYPAL_PLAN_PRO_TRIAL_14: ${PAYPAL_PLAN_PRO_TRIAL_14:-}
      RAZORPAY_PLAN_PRO_ANNUAL: ${RAZORPAY_PLAN_PRO_ANNUAL:-}
      PAYPAL_PLAN_PRO_ANNUAL: ${PAYPAL_PLAN_PRO_ANNUAL:-}
      PAYPAL_PLAN_PRO_ANNUAL_TRIAL_14: ${PAYPAL_PLAN_PRO_ANNUAL_TRIAL_14:-}
      PAYPAL_PRO_ANNUAL_BASE_AMOUNT: ${PAYPAL_PRO_ANNUAL_BASE_AMOUNT:-}
      RAZORPAY_PLAN_BUSINESS: ${RAZORPAY_PLAN_BUSINESS:-}
      PAYPAL_PLAN_BUSINESS: ${PAYPAL_PLAN_BUSINESS:-}
      PAYPAL_PLAN_BUSINESS_TRIAL_14: ${PAYPAL_PLAN_BUSINESS_TRIAL_14:-}
      PAYPAL_BUSINESS_BASE_AMOUNT: ${PAYPAL_BUSINESS_BASE_AMOUNT:-}
      RAZORPAY_PLAN_BUSINESS_ANNUAL: ${RAZORPAY_PLAN_BUSINESS_ANNUAL:-}
      PAYPAL_PLAN_BUSINESS_ANNUAL: ${PAYPAL_PLAN_BUSINESS_ANNUAL:-}
      PAYPAL_PLAN_BUSINESS_ANNUAL_TRIAL_14: ${PAYPAL_PLAN_BUSINESS_ANNUAL_TRIAL_14:-}
      PAYPAL_BUSINESS_ANNUAL_BASE_AMOUNT: ${PAYPAL_BUSINESS_ANNUAL_BASE_AMOUNT:-}
      CASHFREE_ENVIRONMENT: ${CASHFREE_ENVIRONMENT:-production}
      CASHFREE_API_VERSION: ${CASHFREE_API_VERSION:-2026-01-01}
      CASHFREE_CLIENT_ID: ${CASHFREE_CLIENT_ID:-}
      CASHFREE_CLIENT_SECRET: ${CASHFREE_CLIENT_SECRET:-}
      CASHFREE_WEBHOOK_SECRET: ${CASHFREE_WEBHOOK_SECRET:-}
      ENTERPRISE_WINDOWS_INSTALLER: /opt/qsvc/installers/QS-VC-Windows-x64.zip
      ENTERPRISE_MACOS_ARM64_INSTALLER: /opt/qsvc/installers/QS-VC-macOS-arm64.zip
      ENTERPRISE_MACOS_X64_INSTALLER: /opt/qsvc/installers/QS-VC-macOS-x64.zip
      ENTERPRISE_LINUX_X64_INSTALLER: /opt/qsvc/installers/QS-VC-Linux-x64.zip
    volumes:
      - ./installers:/opt/qsvc/installers:ro
    command: [node, services/auth/dist/index.js]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4002/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 12s
      retries: 3
  meeting:
    <<: *app
    environment:
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:-}
      MEETING_POLICY_SECRET: ${MEETING_POLICY_SECRET:-}
      INVITATION_SECRET: ${INVITATION_SECRET:-}
      <<: *runtime
      DATABASE_URL: ${MEETING_DATABASE_URL:?Set the restricted meeting database URL}
    command: [node, services/meeting/dist/index.js]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4003/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 12s
      retries: 3
  signaling:
    <<: *app
    environment:
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:-}
      MEETING_POLICY_SECRET: ${MEETING_POLICY_SECRET:-}
      INVITATION_SECRET: ${INVITATION_SECRET:-}
      TURN_ACCESS_SECRET: ${TURN_ACCESS_SECRET:-}
      QSVC_ENTERPRISE_TERMS_REQUIRED: ${QSVC_ENTERPRISE_TERMS_REQUIRED:-no}
      <<: *runtime
      WS_TRUST_PROXY_HEADER: x-qsvc-client-ip
      # One signaling instance on this host: single-use 30-second join tickets are kept in its
      # memory. Set WS_TICKET_STORE=redis (and REDIS_URL) in .env before running more than one.
      WS_TICKET_STORE: ${WS_TICKET_STORE:-memory}
      SFU_CONTROL_TOKEN: ${SFU_CONTROL_TOKEN:?Set a shared SFU control token}
      CAPTION_TRANSLATION_PROVIDER: ${CAPTION_TRANSLATION_PROVIDER:-libretranslate}
      GOOGLE_TRANSLATE_API_KEY: ${GOOGLE_TRANSLATE_API_KEY:-}
      LIBRETRANSLATE_URL: ${LIBRETRANSLATE_URL:-}
      LIBRETRANSLATE_API_KEY: ${LIBRETRANSLATE_API_KEY:-}
      # Multilingual captions on the GPU host (deploy/aws/gpu). Private VPC addresses only.
      ASR_URL: ${ASR_URL:-}
      ASR_API_KEY: ${ASR_API_KEY:-}
      ASR_MAX_SESSIONS: ${ASR_MAX_SESSIONS:-50}
      MINUTES_LLM_URL: ${MINUTES_LLM_URL:-}
      MINUTES_LLM_MODEL: ${MINUTES_LLM_MODEL:-}
      MINUTES_LLM_API_KEY: ${MINUTES_LLM_API_KEY:-}
      CAPTION_MAX_ROOMS: ${CAPTION_MAX_ROOMS:-500}
      CAPTION_ROOM_CONCURRENCY: ${CAPTION_ROOM_CONCURRENCY:-8}
      CAPTION_GLOBAL_CONCURRENCY: ${CAPTION_GLOBAL_CONCURRENCY:-64}
    command: [node, services/signaling/dist/index.js]
  sfu:
    <<: *app
    environment:
      <<: *runtime
      SFU_CONTROL_TOKEN: ${SFU_CONTROL_TOKEN:?Set a shared SFU control token}
      SFU_CONTROL_HOST: 127.0.0.1
    command: [node, services/sfu/dist/index.js]
  recording:
    <<: *app
    environment:
      <<: *runtime
      AWS_REGION: ap-south-1
      RECORDING_BUCKET: ${RECORDING_BUCKET:?Set the private recordings bucket}
    command: [node, services/recording/dist/index.js]
  migrate:
    <<: *app
    profiles: [maintenance]
    restart: 'no'
    environment:
      NODE_ENV: production
      # Supplied only while deploy-production.sh runs migrations (read from SSM). Optional here so
      # building and starting the other services does not need the migration credential;
      # db/migrate.js refuses to run without it.
      DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      POSTGRES_SSL: verify-full
      POSTGRES_CA_FILE: /opt/qsvc/certs/rds-ca.pem
    command: [node, db/migrate.js]
  turn:
    image: coturn/coturn:4.6.3
    network_mode: host
    restart: unless-stopped
    entrypoint: [sh, /etc/coturn/start.sh]
    environment:
      TURN_SECRET: ${TURN_SECRET:?Set a private shared TURN secret}
      TURN_REALM: ${DOMAIN}
      SFU_ANNOUNCED_IP: ${SFU_ANNOUNCED_IP}
      TURN_ALLOWED_SFU_IP: ${TURN_ALLOWED_SFU_IP:-}
    volumes:
      - ../turn/start.sh:/etc/coturn/start.sh:ro
      - ../turn/peer-policy.conf:/etc/coturn/peer-policy.conf:ro
  web:
    image: qsvc-web:local
    build:
      context: ../..
      dockerfile: deploy/aws/Dockerfile
      target: web
    ports:
      - 127.0.0.1:8080:5173
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    network_mode: host
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ORIGIN_AUTH_SECRET: ${ORIGIN_AUTH_SECRET:?Set the private Cloudflare-to-origin secret}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  keycloak-data:
  caddy_data:
  caddy_config:

networks:
  keycloak-db:
    internal: true

secrets:
  session_signing_key:
    file: ${SESSION_SIGNING_KEY_FILE:?Set the Ed25519 auth signing key file}
