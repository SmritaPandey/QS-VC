# Builds the QS-VC installers that need a specific OS or KVM. Run manually (Actions → On-prem installers).
# The server package and its .run are built and signed on the offline release machine (RELEASE_CHECKLIST.md);
# this workflow only receives the signed .run (time-limited private URL) to put inside the appliance.
# Make the repository PRIVATE before running: artifacts of a public repository can be downloaded by others.
name: On-prem installers
on:
  workflow_dispatch:
    inputs:
      version:        { description: 'Release version (e.g. 1.0.0)', required: true }
      build_desktop:  { description: 'Build branch app installers (Windows/macOS/Linux)', type: boolean, default: true }
      build_windows_server: { description: 'Build Windows Server setup EXE', type: boolean, default: true }
      build_appliance: { description: 'Build Rocky 9 appliance (needs the inputs below)', type: boolean, default: false }
      run_url:        { description: 'Private time-limited URL of the signed qsvc-server-setup-<version>.run', required: false }
      run_sha256:     { description: 'SHA-256 of that .run', required: false }
      rocky_iso_url:  { description: 'Rocky Linux 9 minimal ISO URL', required: false, default: 'https://download.rockylinux.org/pub/rocky/9/isos/x86_64/Rocky-9-latest-x86_64-minimal.iso' }
      rocky_iso_sha256: { description: 'SHA-256 of that ISO (from Rocky CHECKSUM)', required: false }
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release inputs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a release version such as 1.1.0'; exit 1; }

  desktop:
    needs: validate
    if: inputs.build_desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: '--win nsis msi --x64', name: windows }
          # One architecture per job: electron-builder's pkg target races when building both at once.
          - { os: macos-latest,   args: '--mac dmg pkg --arm64', name: macos-arm64 }
          - { os: macos-latest,   args: '--mac dmg pkg --x64', name: macos-x64 }
          - { os: ubuntu-latest,  args: '--linux deb rpm AppImage --x64', name: linux }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: frontend/desktop } }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci --no-audit --no-fund
      - run: npm version --no-git-tag-version --allow-same-version "$RELEASE_VERSION"
        shell: bash
        env: { RELEASE_VERSION: '${{ inputs.version }}' }
      - run: npm run build
      # Code signing: set CSC_LINK / CSC_KEY_PASSWORD (Windows) and APPLE_* secrets when certificates exist.
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: qsvc-app-${{ matrix.name }}-${{ inputs.version }}
          path: |
            frontend/desktop/release/*.exe
            frontend/desktop/release/*.msi
            frontend/desktop/release/*.dmg
            frontend/desktop/release/*.pkg
            frontend/desktop/release/*.deb
            frontend/desktop/release/*.rpm
            frontend/desktop/release/*.AppImage
          if-no-files-found: error
          retention-days: 14

  windows-server:
    needs: validate
    if: inputs.build_windows_server
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build QS-VC-Server-Setup.exe
        shell: pwsh
        working-directory: deploy/vc-onprem/windows-server
        env: { RELEASE_VERSION: '${{ inputs.version }}' }
        run: |
          if (Select-String -Quiet -SimpleMatch 'DRAFT-EULA-PLACEHOLDER' ../installer/EULA.txt) {
            throw 'Provide the approved EULA before building the Windows Server installer.'
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:RELEASE_VERSION" /Ooutput QS-VC-Server-Setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: qsvc-windows-server-${{ inputs.version }}
          path: deploy/vc-onprem/windows-server/output/*.exe
          if-no-files-found: error
          retention-days: 14

  appliance:
    needs: validate
    if: inputs.build_appliance
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      ROCKY_ISO_URL: ${{ inputs.rocky_iso_url }}
      ROCKY_ISO_SHA256: ${{ inputs.rocky_iso_sha256 }}
      RUN_SHA256: ${{ inputs.run_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Check inputs
        env: { RUN_URL: '${{ inputs.run_url }}' }
        run: |
          [[ -n "$RUN_URL" && "$RUN_SHA256" =~ ^[0-9a-f]{64}$ && "$ROCKY_ISO_SHA256" =~ ^[0-9a-f]{64}$ ]] \
            || { echo 'run_url, run_sha256 and rocky_iso_sha256 are required for the appliance'; exit 1; }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Tools
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils ovmf zip
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install -y packer
      - name: Fetch the signed server installer
        env: { RUN_URL: '${{ inputs.run_url }}' }
        run: |
          curl -fsSL --proto "=https" --proto-redir "=https" -o setup.run "$RUN_URL"
          echo "$RUN_SHA256  setup.run" | sha256sum -c -
      - name: Build appliance
        working-directory: deploy/vc-onprem/appliance
        run: |
          pw=$(openssl rand -hex 24); echo "::add-mask::$pw"
          packer init .
          packer build -var "iso_url=$ROCKY_ISO_URL" -var "iso_checksum=sha256:$ROCKY_ISO_SHA256" \
            -var "setup_run=$GITHUB_WORKSPACE/setup.run" -var "version=$RELEASE_VERSION" -var "build_password=$pw" .
          bash make-images.sh "out-$RELEASE_VERSION/qsvc-appliance-$RELEASE_VERSION.qcow2" "$RELEASE_VERSION" "$GITHUB_WORKSPACE/appliance"
      - uses: actions/upload-artifact@v4
        with:
          name: qsvc-appliance-${{ inputs.version }}
          path: appliance/
          if-no-files-found: error
          retention-days: 7
