name: Desktop downloads

# Builds the QS-VC desktop app as plain ZIP archives (no installers) for Windows, Mac and
# Linux and publishes them to the GitHub release "desktop-latest". The production deployment
# picks them up from there; it never builds desktop apps itself.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/desktop/**'
      - '.github/workflows/desktop-downloads.yml'
      - 'docs/QS-VC-Intranet-Setup.pdf'
      - 'shared/entitlements.cjs'

permissions:
  contents: read

concurrency:
  group: qsvc-desktop-downloads
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }} ZIP
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest, script: 'package:win:x64', file: QS-VC-Windows-x64.zip, smoke: required }
          - { name: Mac Apple silicon, os: macos-latest, script: 'package:mac:arm64', file: QS-VC-macOS-arm64.zip, smoke: required }
          - { name: Mac Intel, os: macos-latest, script: 'package:mac:x64', file: QS-VC-macOS-x64.zip, smoke: optional }
          - { name: Linux x64, os: ubuntu-latest, script: 'package:linux:x64', file: QS-VC-Linux-x64.zip, smoke: required }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/desktop/package-lock.json
      - name: Install desktop dependencies
        run: npm ci --prefix frontend/desktop
      - name: Test the smoke-test runner
        run: node --test frontend/desktop/scripts/smoke-test.test.cjs
      - name: Build ZIP
        run: npm --prefix frontend/desktop run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test desktop meeting controls
        run: node --test frontend/desktop/scripts/meeting-actions.test.cjs
      - name: Install a virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      # Start the packaged app from the ZIP exactly as a user would. The app renders its start page,
      # writes OK to QSVC_SMOKE_TEST and quits; a startup crash leaves no result and fails the build.
      # (Mac Intel runs under Rosetta on the Apple silicon runner, so its result is advisory.)
      - name: Start the packaged app (smoke test)
        shell: bash
        working-directory: frontend/desktop/release
        continue-on-error: ${{ matrix.smoke == 'optional' }}
        run: |
          set -euo pipefail
          rm -rf smoke && mkdir smoke
          case "${{ runner.os }}" in
            Linux)   unzip -q "${{ matrix.file }}" -d smoke/app
                     # ZIPs cannot preserve root ownership/setuid. Prepare only the extracted
                     # CI copy, as an administrator would on a restricted enterprise machine.
                     sudo chown root:root smoke/app/chrome-sandbox
                     sudo chmod 4755 smoke/app/chrome-sandbox
                     cmd=(xvfb-run -a smoke/app/qs-vc) ;;
            Windows) unzip -q "${{ matrix.file }}" -d smoke/app; cmd=(smoke/app/QS-VC.exe) ;;
            macOS)   ditto -x -k "${{ matrix.file }}" smoke/app
                     codesign --verify --deep --strict --verbose=2 smoke/app/QS-VC.app
                     cmd=(smoke/app/QS-VC.app/Contents/MacOS/QS-VC) ;;
          esac
          result="$(pwd -W 2>/dev/null || pwd)/smoke/result.txt"
          node ../scripts/smoke-test.cjs "$result" "${cmd[@]}"
          rm -rf smoke
      - name: Verify ZIP and write checksum
        shell: bash
        working-directory: frontend/desktop/release
        run: |
          set -euo pipefail
          test -s "${{ matrix.file }}"
          # Ship the getting-started, prerequisites and intranet setup guides at the top of every ZIP.
          python3 -c "import sys, zipfile; z = zipfile.ZipFile(sys.argv[1], 'a', zipfile.ZIP_DEFLATED); [z.write(f, f.replace(chr(92), '/').split('/')[-1]) for f in sys.argv[2:]]; z.close()" "${{ matrix.file }}" ../guide/QS-VC-Getting-Started.pdf ../guide/QS-VC-Prerequisites.pdf ../../../docs/QS-VC-Intranet-Setup.pdf
          python3 -c "import sys, zipfile; names = zipfile.ZipFile(sys.argv[1]).namelist(); missing = [n for n in ('QS-VC-Getting-Started.pdf', 'QS-VC-Prerequisites.pdf', 'QS-VC-Intranet-Setup.pdf') if n not in names]; sys.exit(f'guides missing: {missing}' if missing else 0)" "${{ matrix.file }}"
          python3 -c "import sys, zipfile; z = zipfile.ZipFile(sys.argv[1]); bad = z.testzip(); sys.exit(f'corrupt entry {bad}' if bad else 0)" "${{ matrix.file }}"
          python3 -c "import hashlib, sys; f = sys.argv[1]; open(f + '.sha256', 'wb').write((hashlib.sha256(open(f, 'rb').read()).hexdigest() + '  ' + f + chr(10)).encode())" "${{ matrix.file }}"
          cat "${{ matrix.file }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: |
            frontend/desktop/release/${{ matrix.file }}
            frontend/desktop/release/${{ matrix.file }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to desktop-latest release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: zips
          merge-multiple: true
      - name: Upload ZIPs to the desktop-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l zips
          if ! gh release view desktop-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create desktop-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "QS-VC desktop downloads" --notes "Plain ZIP archives of the QS-VC desktop app. Updated automatically." --latest=false
          fi
          gh release upload desktop-latest zips/QS-VC-*.zip zips/QS-VC-*.zip.sha256 --repo "$GITHUB_REPOSITORY" --clobber
      # The server copies ZIPs from desktop-latest during a deployment, so start one now.
      - name: Deploy the new ZIPs to the server
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-production.yml --repo "$GITHUB_REPOSITORY" --ref main
