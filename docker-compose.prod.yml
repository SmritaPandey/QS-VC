# QS-VC Production Docker Compose
# Usage: docker compose -f docker-compose.prod.yml up -d
# Caddy provisions internal TLS certificates for intranet deployments.

version: "3.9"

services:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # REVERSE PROXY (TLS Termination)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  caddy:
    image: caddy:2-alpine
    container_name: qsvc-caddy
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./config/Caddyfile.template:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      QSVC_DOMAIN: ${DOMAIN:-meet.internal}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      - web
      - signaling
      - auth
      - meeting
      - recording
    restart: always

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # INFRASTRUCTURE
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  postgres:
    image: postgres:16-alpine
    container_name: qsvc-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set a database administration role}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the database administration password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: qsvc-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set a unique REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  minio:
    image: minio/minio:latest
    container_name: qsvc-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  coturn:
    image: coturn/coturn:4.6.3
    container_name: qsvc-coturn
    command: >
      -n --lt-cred-mech --use-auth-secret --static-auth-secret=${TURN_SECRET:?Set a unique shared TURN_SECRET} --realm=${DOMAIN} --listening-port=3478 --min-port=49152 --max-port=49200 --log-file=stdout
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49152-49200:49152-49200/udp"
    restart: always

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # APPLICATION SERVICES
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  sfu:
    image: qsvc-sfu:intranet
    build:
      context: ./services/sfu
      dockerfile: Dockerfile
    container_name: qsvc-sfu
    ports:
      - "40000-40100:40000-40100/udp"
    environment:
      - SFU_CONTROL_TOKEN=${SFU_CONTROL_TOKEN:?Set a shared SFU control token}
      - NODE_ENV=production
      - SFU_PORT=4000
      - SFU_ANNOUNCED_IP=${SFU_ANNOUNCED_IP:?Set the SFU address reachable by meeting clients}
      - SFU_MIN_PORT=40000
      - SFU_MAX_PORT=40100
      - SFU_NUM_WORKERS=4
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CORS_ORIGINS=https://${DOMAIN}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always

  signaling:
    image: qsvc-signaling:intranet
    build:
      context: .
      dockerfile: services/signaling/Dockerfile
    container_name: qsvc-signaling
    environment:
      - QSVC_ENTERPRISE_TERMS_REQUIRED=${QSVC_ENTERPRISE_TERMS_REQUIRED:-no}
      - SFU_CONTROL_TOKEN=${SFU_CONTROL_TOKEN:?Set a shared SFU control token}
      - NODE_ENV=production
      - SIGNALING_PORT=4001
      - WS_TRUST_PROXY_HEADER=x-qsvc-client-ip
      - SFU_INTERNAL_URL=http://sfu:4000
      - AUTH_INTERNAL_URL=http://auth:4002
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set a unique REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:?Set a random JWT_SECRET}
      - CORS_ORIGINS=https://${DOMAIN}
      - LIBRETRANSLATE_URL=${LIBRETRANSLATE_URL:-}
      - LIBRETRANSLATE_API_KEY=${LIBRETRANSLATE_API_KEY:-}
      - CAPTION_TRANSLATION_PROVIDER=${CAPTION_TRANSLATION_PROVIDER:-}
      - GOOGLE_TRANSLATE_API_KEY=${GOOGLE_TRANSLATE_API_KEY:-}
      - ASR_URL=${ASR_URL:-}
      - ASR_API_KEY=${ASR_API_KEY:-}
      - MINUTES_LLM_URL=${MINUTES_LLM_URL:-}
      - MINUTES_LLM_MODEL=${MINUTES_LLM_MODEL:-}
      - MINUTES_LLM_API_KEY=${MINUTES_LLM_API_KEY:-}
      - MEETING_INTERNAL_URL=${MEETING_INTERNAL_URL:-http://meeting:4003}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:4001/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always

  auth:
    image: qsvc-auth:intranet
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: qsvc-auth
    environment:
      - QSVC_ENTERPRISE_TERMS_REQUIRED=${QSVC_ENTERPRISE_TERMS_REQUIRED:-no}
      - NODE_ENV=production
      - AUTH_PORT=4002
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${AUTH_DB_USER:-qs_auth_app}
      - POSTGRES_PASSWORD=${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD for the restricted auth database role}
      - JWT_SECRET=${JWT_SECRET:?Set a random JWT_SECRET}
      - JWT_EXPIRY=24h
      - PAYMENTS_ENABLED=${PAYMENTS_ENABLED:-false}
      - PAYMENT_TERMS_CONFIRMED=${PAYMENT_TERMS_CONFIRMED:-false}
      - PAYMENT_RETURN_URL=${PAYMENT_RETURN_URL:-}
      - AUTH_PUBLIC_URL=${AUTH_PUBLIC_URL:-}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      - RAZORPAY_PLAN_STARTER=${RAZORPAY_PLAN_STARTER:-}
      - RAZORPAY_PLAN_PRO=${RAZORPAY_PLAN_PRO:-}
      - PAYPAL_ENVIRONMENT=${PAYPAL_ENVIRONMENT:-sandbox}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - PAYPAL_WEBHOOK_ID=${PAYPAL_WEBHOOK_ID:-}
      - PAYPAL_PLAN_STARTER=${PAYPAL_PLAN_STARTER:-}
      - PAYPAL_PLAN_PRO=${PAYPAL_PLAN_PRO:-}
      - PAYPAL_PLAN_STARTER_TRIAL=${PAYPAL_PLAN_STARTER_TRIAL:-}
      - PAYPAL_PLAN_PRO_TRIAL=${PAYPAL_PLAN_PRO_TRIAL:-}
      - PAYPAL_CURRENCY=${PAYPAL_CURRENCY:-USD}
      - PAYPAL_STARTER_BASE_AMOUNT=${PAYPAL_STARTER_BASE_AMOUNT:-}
      - PAYPAL_PRO_BASE_AMOUNT=${PAYPAL_PRO_BASE_AMOUNT:-}
      - CASHFREE_ENVIRONMENT=${CASHFREE_ENVIRONMENT:-production}
      - CASHFREE_API_VERSION=${CASHFREE_API_VERSION:-2026-01-01}
      - CASHFREE_CLIENT_ID=${CASHFREE_CLIENT_ID:-}
      - CASHFREE_CLIENT_SECRET=${CASHFREE_CLIENT_SECRET:-}
      - CASHFREE_WEBHOOK_SECRET=${CASHFREE_WEBHOOK_SECRET:-}
      - TURN_SECRET=${TURN_SECRET:?Set a unique shared TURN_SECRET}
      - TURN_SERVERS=turn:${DOMAIN}:3478?transport=udp,turn:${DOMAIN}:3478?transport=tcp
      - CORS_ORIGINS=https://${DOMAIN}
      # Desktop app downloads on the Intranet page (plain ZIPs; a missing file shows "not available yet").
      - ENTERPRISE_WINDOWS_INSTALLER=/opt/qsvc/installers/QS-VC-Windows-x64.zip
      - ENTERPRISE_MACOS_ARM64_INSTALLER=/opt/qsvc/installers/QS-VC-macOS-arm64.zip
      - ENTERPRISE_MACOS_X64_INSTALLER=/opt/qsvc/installers/QS-VC-macOS-x64.zip
      - ENTERPRISE_LINUX_X64_INSTALLER=/opt/qsvc/installers/QS-VC-Linux-x64.zip
    volumes:
      - ./installers:/opt/qsvc/installers:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:4002/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always

  meeting:
    image: qsvc-meeting:intranet
    build:
      context: .
      dockerfile: services/meeting/Dockerfile
    container_name: qsvc-meeting
    environment:
      - NODE_ENV=production
      - MEETING_PORT=4003
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${MEETING_DB_USER:-qs_meeting_app}
      - POSTGRES_PASSWORD=${MEETING_DB_PASSWORD:?Set MEETING_DB_PASSWORD for the restricted meeting database role}
      - JWT_SECRET=${JWT_SECRET:?Set a random JWT_SECRET}
      - WEB_URL=https://${DOMAIN}
      - CORS_ORIGINS=https://${DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:4003/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always

  recording:
    image: qsvc-recording:intranet
    build:
      context: .
      dockerfile: services/recording/Dockerfile
    container_name: qsvc-recording
    environment:
      - NODE_ENV=production
      - RECORDING_PORT=4004
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=qsvc-recordings
      - CORS_ORIGINS=https://${DOMAIN}
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:4004/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always

  web:
    image: qsvc-web:intranet
    build:
      context: .
      dockerfile: frontend/web/Dockerfile
    container_name: qsvc-web
    environment:
      - VITE_SIGNALING_URL=wss://${DOMAIN}/ws
      - VITE_AUTH_URL=https://${DOMAIN}/api/auth
      - VITE_MEETING_URL=https://${DOMAIN}/api/meetings
      - VITE_RECORDING_URL=https://${DOMAIN}/api/recordings
    restart: always

  # ── Self-hosted AI (opt-in): docker compose --profile ai up -d asr mt ──
  # Then set ASR_URL=http://asr:8000 and LIBRETRANSLATE_URL=http://mt:5000 for signaling.
  asr:
    profiles: ["ai"]
    build:
      context: ./services/asr
      args:
        BASE: ${ASR_BASE_IMAGE:-python:3.11-slim}
        ONNX_RUNTIME: ${ASR_ONNX_RUNTIME:-onnxruntime==1.20.1}
    container_name: qsvc-asr
    environment:
      - ASR_MODEL=${ASR_MODEL:-}
      - ASR_LANGUAGES=${ASR_LANGUAGES:-}
      - ASR_PROMPT=${ASR_PROMPT:-}
      - ASR_API_KEY=${ASR_API_KEY:-}
      - ASR_ENGINE=${ASR_ENGINE:-hybrid}
      - ASR_INDIC_LANGUAGES=${ASR_INDIC_LANGUAGES:-}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - asr_models:/models
    restart: unless-stopped
    # GPU: uncomment and build with ASR_BASE_IMAGE=nvidia/cuda:12.4.1-cudnn-runtime-ubuntu22.04
    # deploy: { resources: { reservations: { devices: [ { driver: nvidia, count: 1, capabilities: [gpu] } ] } } }

  mt:
    profiles: ["ai"]
    build:
      context: ./services/mt
      args:
        BASE: ${MT_BASE_IMAGE:-python:3.11-slim}
    container_name: qsvc-mt
    environment:
      - MT_LANGUAGES=${MT_LANGUAGES:-}
      - MT_API_KEY=${LIBRETRANSLATE_API_KEY:-}
      - MT_GLOSSARY_FILE=/app/glossary.example.json
    volumes:
      - mt_models:/models
    restart: unless-stopped
    # deploy: { resources: { reservations: { devices: [ { driver: nvidia, count: 1, capabilities: [gpu] } ] } } }

volumes:
  caddy_data:
  caddy_config:
  asr_models:
  mt_models:
  postgres_data:
  redis_data:
  minio_data:
