
name: QSVC Production Deployment

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'db/**'
      - 'deploy/aws/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qsvc-production-deployment
  cancel-in-progress: false

jobs:
  changes:
    name: Detect release changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'services/**'
              - 'db/**'
              - 'deploy/aws/**'

  verify:
    name: Verify production revision
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: [verify, changes]
    if: >-
      needs.verify.result == 'success' &&
      (needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch')
    name: Deploy QSVC to AWS
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ap-south-1
      RELEASE_SHA: ${{ github.sha }}
      DEPLOY_BUCKET: ${{ vars.QSVC_DEPLOY_BUCKET }}
      EC2_INSTANCE_ID: ${{ vars.QSVC_EC2_INSTANCE_ID }}

    steps:
      - name: Checkout approved source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Desktop apps are plain ZIP downloads published by the separate "Desktop downloads"
      # workflow to the GitHub release `desktop-latest`. Deployments never build them.
      - name: Fetch desktop ZIP downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/qsvc-desktop
          if gh release download desktop-latest --repo "$GITHUB_REPOSITORY" --pattern 'QS-VC-*.zip*' --dir /tmp/qsvc-desktop --clobber; then
            ls -l /tmp/qsvc-desktop
          else
            echo "No desktop-latest release yet; the server keeps any ZIPs it already has."
          fi

      - name: Validate deployment files
        shell: bash
        run: |
          set -euo pipefail

          test -f deploy/aws/compose.yml
          test -f deploy/aws/Dockerfile
          test -f db/migrate.js
          test -f db/migrations/006_enterprise_access_terms.sql
          test -f db/migrations/013_linux_desktop_support.sql

          echo "Required deployment files found"

      - name: Check migration filenames
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          files = sorted(
              p.name for p in Path("db/migrations").glob("*.sql")
          )

          assert files, "No migration files found"
          assert len(files) == len(set(files))

          for filename in files:
              print("Migration:", filename)
          PY

      - name: Check GitHub deployment role configuration
        env:
          DEPLOY_ROLE_ARN: ${{ vars.QSVC_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_ROLE_ARN" ]]; then
            echo "QSVC_DEPLOY_ROLE_ARN is missing. Add it as a GitHub Actions variable for the production environment (or repository)."
            exit 1
          fi

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.QSVC_DEPLOY_ROLE_ARN }}
          role-session-name: qsvc-production-deploy

      - name: Verify AWS deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$DEPLOY_BUCKET" ]]; then
            echo "QSVC_DEPLOY_BUCKET is missing. Set it as a GitHub Actions variable for the production environment (or repository)."
            exit 1
          fi
          if [[ -z "$EC2_INSTANCE_ID" ]]; then
            echo "QSVC_EC2_INSTANCE_ID is missing. Set it as a GitHub Actions variable for the production environment (or repository)."
            exit 1
          fi

          aws sts get-caller-identity \
            --query '{Account:Account,Arn:Arn}'

          PING_STATUS=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$EC2_INSTANCE_ID" \
            --query 'InstanceInformationList[].PingStatus' \
            --output text)
          if [[ "$PING_STATUS" != "Online" ]]; then
            echo "EC2 instance $EC2_INSTANCE_ID is not online in Systems Manager (PingStatus: ${PING_STATUS:-not registered}). Check its SSM agent, instance role, and network access."
            exit 1
          fi

      - name: Package approved source
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_DIR="/tmp/qsvc-release-source"
          mkdir -p "$RELEASE_DIR/deploy/aws/installers"
          git archive --format=tar "$RELEASE_SHA" | tar -x -C "$RELEASE_DIR"
          for file in /tmp/qsvc-desktop/QS-VC-*.zip /tmp/qsvc-desktop/QS-VC-*.zip.sha256; do
            if [[ -f "$file" ]]; then install -m 0644 "$file" "$RELEASE_DIR/deploy/aws/installers/"; fi
          done
          tar -czf /tmp/qsvc-release.tar.gz -C "$RELEASE_DIR" .

          sha256sum /tmp/qsvc-release.tar.gz \
            | awk '{print $1}' \
            > /tmp/qsvc-release.sha256

          echo "Release archive created"

      - name: Upload release to private S3
        id: upload
        shell: bash
        run: |
          set -euo pipefail

          KEY="qsvc/releases/${RELEASE_SHA}.tar.gz"
          URI="s3://${DEPLOY_BUCKET}/${KEY}"

          aws s3 cp \
            /tmp/qsvc-release.tar.gz \
            "$URI" \
            --sse AES256

          echo "uri=$URI" >> "$GITHUB_OUTPUT"

      - name: Trigger EC2 deployment through SSM
        id: ssm
        shell: bash
        env:
          RELEASE_URI: ${{ steps.upload.outputs.uri }}
        run: |
          set -euo pipefail

          CHECKSUM="$(cat /tmp/qsvc-release.sha256)"

          # The EC2 instance profile has read-only access to this release prefix.
          read -r -d '' REMOTE_SCRIPT <<'REMOTE' || true
          set -Eeuo pipefail
          set +x
          umask 077

          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid release SHA" >&2; exit 2; }
          [[ "$EXPECTED_CHECKSUM" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid archive checksum" >&2; exit 2; }

          ROOT=/opt/qsvc
          TEMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TEMP_DIR"' EXIT
          test -s "$ROOT/deploy/aws/.env" || { echo "Missing server config: $ROOT/deploy/aws/.env" >&2; exit 1; }
          test -s "$ROOT/certs/rds-ca.pem" || { echo "Missing RDS CA certificate: $ROOT/certs/rds-ca.pem" >&2; exit 1; }

          ARCHIVE="$TEMP_DIR/qsvc-release.tar.gz"
          STAGE="$TEMP_DIR/release"
          aws s3 cp "$RELEASE_URI" "$ARCHIVE" --region ap-south-1
          printf '%s  %s\n' "$EXPECTED_CHECKSUM" "$ARCHIVE" | sha256sum --check --status || {
            echo "Release archive checksum mismatch" >&2
            exit 1
          }
          mkdir -p "$STAGE"
          tar -xzf "$ARCHIVE" -C "$STAGE"

          test -f "$STAGE/deploy/aws/compose.yml"
          test -f "$STAGE/deploy/aws/deploy-production.sh"
          test -f "$STAGE/db/migrate.js"
          mkdir -p "$STAGE/deploy/aws/installers" "$STAGE/certs"
          cp -p "$ROOT/deploy/aws/.env" "$STAGE/deploy/aws/.env"
          cp -p "$ROOT/certs/rds-ca.pem" "$STAGE/certs/rds-ca.pem"

          # Desktop ZIPs come from the desktop-latest GitHub release when it exists;
          # otherwise carry forward the ZIPs already on the server.
          for installer in \
            QS-VC-Windows-x64.zip QS-VC-Windows-x64.zip.sha256 \
            QS-VC-macOS-arm64.zip QS-VC-macOS-arm64.zip.sha256 \
            QS-VC-macOS-x64.zip QS-VC-macOS-x64.zip.sha256 \
            QS-VC-Linux-x64.zip QS-VC-Linux-x64.zip.sha256; do
            if [[ ! -s "$STAGE/deploy/aws/installers/$installer" ]]; then
              if [[ -s "$ROOT/deploy/aws/installers/$installer" ]]; then
                cp -p "$ROOT/deploy/aws/installers/$installer" "$STAGE/deploy/aws/installers/$installer"
              else
                # A missing desktop package must not block a backend/web release;
                # its download link reports "unavailable" until a desktop build publishes it.
                echo "Warning: desktop package not available yet: $installer (run the Desktop downloads workflow to publish it)" >&2
              fi
            fi
          done

          # Overlay the checked release while retaining server-only files. The
          # .env and RDS CA were copied into the stage above and are preserved.
          cp -a "$STAGE/." "$ROOT/"
          chmod 600 "$ROOT/deploy/aws/.env"
          chmod 644 "$ROOT/certs/rds-ca.pem"

          echo "Building production images for $EXPECTED_SHA"
          docker compose -f "$ROOT/deploy/aws/compose.yml" --env-file "$ROOT/deploy/aws/.env" build
          echo "Running migrations and starting services"
          "$ROOT/deploy/aws/deploy-production.sh"
          REMOTE

          REMOTE_PAYLOAD=$(printf 'RELEASE_URI=%q\nEXPECTED_SHA=%q\nEXPECTED_CHECKSUM=%q\n%s\n' \
            "$RELEASE_URI" "$RELEASE_SHA" "$CHECKSUM" "$REMOTE_SCRIPT")
          REMOTE_B64=$(printf '%s' "$REMOTE_PAYLOAD" | base64 -w 0)
          COMMAND="printf '%s' '$REMOTE_B64' | base64 --decode | sudo bash"

          jq -n \
            --arg cmd "$COMMAND" \
            '{
              commands: [$cmd],
              executionTimeout: ["3600"]
            }' > /tmp/ssm-params.json

          COMMAND_ID=$(
            aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters file:///tmp/ssm-params.json \
              --comment "QSVC approved production deployment" \
              --query 'Command.CommandId' \
              --output text
          )

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command submitted: $COMMAND_ID"

      - name: Wait for deployment result
        shell: bash
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 120); do
            if ! STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>/tmp/qsvc-ssm-poll-error); then
              if grep -q 'InvocationDoesNotExist' /tmp/qsvc-ssm-poll-error; then
                echo "SSM has not published invocation status yet (attempt $attempt/120)"
                sleep 5
                continue
              fi
              cat /tmp/qsvc-ssm-poll-error >&2
              exit 1
            fi

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment succeeded"
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed; remote command output follows:"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,ResponseCode:ResponseCode,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
              Pending|InProgress|Delayed)
                sleep 20
                ;;
              *)
                echo "Unknown SSM status: $STATUS"
                exit 1
                ;;
            esac
          done

          echo "Deployment polling timed out"
          exit 1

      - name: Deployment summary
        if: always()
        shell: bash
        env:
          DEPLOY_RESULT: ${{ job.status }}
        run: |
          {
            echo "## QSVC Production Deployment"
            echo ""
            echo "- Commit: \`$RELEASE_SHA\`"
            echo "- Region: \`$AWS_REGION\`"
            echo "- Result: \`$DEPLOY_RESULT\`"
          } >> "$GITHUB_STEP_SUMMARY"
