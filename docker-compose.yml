version: "3.9"

services:
  keycloak-db:
    extends: { file: ./deploy/keycloak/compose.yml, service: keycloak-db }
    volumes:
      - keycloak-data:/var/lib/postgresql/data
      - ./deploy/keycloak/init-db.sql:/docker-entrypoint-initdb.d/01-keycloak.sql:ro
  keycloak:
    extends: { file: ./deploy/keycloak/compose.yml, service: keycloak }
    environment:
      QSVC_SSO_AUTH_URL: ${QSVC_SSO_AUTH_URL:-http://localhost:4002}
    volumes:
      - ./deploy/keycloak/qsvc-realm.json:/opt/keycloak/data/import/qsvc-realm.json:ro
    networks: [default, keycloak-db]
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # INFRASTRUCTURE
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  postgres:
    image: postgres:16-alpine
    container_name: qsvc-postgres
    environment:
      POSTGRES_DB: qsvc
      POSTGRES_USER: qsvc
      POSTGRES_PASSWORD: qsvc_dev_2025
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5434:5432"
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U qsvc" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: qsvc-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ./docker-data/redis:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: qsvc-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: qsvc_minio
      MINIO_ROOT_PASSWORD: qsvc_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./docker-data/minio:/data

  coturn:
    entrypoint: [sh, /etc/coturn/start.sh]
    volumes:
      - ./deploy/turn/start.sh:/etc/coturn/start.sh:ro
      - ./deploy/turn/peer-policy.conf:/etc/coturn/peer-policy.conf:ro
    environment:
      NODE_ENV: development
      TURN_SECRET: ${TURN_SECRET:-dev-turn-secret-change-in-production}
      TURN_REALM: ${TURN_REALM:-qsvc}
      SFU_ANNOUNCED_IP: ${SFU_ANNOUNCED_IP:-}
      TURN_ALLOWED_SFU_IP: ${TURN_ALLOWED_SFU_IP:-}
    image: coturn/coturn:latest
    container_name: qsvc-coturn
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49152-49200:49152-49200/udp"
    restart: unless-stopped

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # APPLICATION SERVICES
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  sfu:
    build:
      context: ./services/sfu
      dockerfile: Dockerfile
    container_name: qsvc-sfu
    # Note: ports not needed — network_mode: host exposes all ports directly
    environment:
      - NODE_ENV=development
      - SFU_PORT=4000
      - SFU_ANNOUNCED_IP=${SFU_ANNOUNCED_IP:-127.0.0.1}
      - SFU_MIN_PORT=40000
      - SFU_MAX_PORT=40100
      - SFU_NUM_WORKERS=2
      - SFU_LOG_LEVEL=debug
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    network_mode: host

  signaling:
    build:
      context: .
      dockerfile: services/signaling/Dockerfile
    container_name: qsvc-signaling
    ports:
      - "4001:4001"
    environment:
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - MEETING_POLICY_SECRET=${MEETING_POLICY_SECRET:-}
      - INVITATION_SECRET=${INVITATION_SECRET:-}
      - TURN_ACCESS_SECRET=${TURN_ACCESS_SECRET:-}
      - NODE_ENV=development
      - SIGNALING_PORT=4001
      - SFU_INTERNAL_URL=http://localhost:4000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=qsvc
      - POSTGRES_USER=qsvc
      - POSTGRES_PASSWORD=qsvc_dev_2025
      - LIBRETRANSLATE_URL=${LIBRETRANSLATE_URL:-}
      - LIBRETRANSLATE_API_KEY=${LIBRETRANSLATE_API_KEY:-}
      - CAPTION_TRANSLATION_PROVIDER=${CAPTION_TRANSLATION_PROVIDER:-}
      - GOOGLE_TRANSLATE_API_KEY=${GOOGLE_TRANSLATE_API_KEY:-}
      - ASR_URL=${ASR_URL:-}
      - ASR_API_KEY=${ASR_API_KEY:-}
      - MINUTES_LLM_URL=${MINUTES_LLM_URL:-}
      - MINUTES_LLM_MODEL=${MINUTES_LLM_MODEL:-}
      - MINUTES_LLM_API_KEY=${MINUTES_LLM_API_KEY:-}
      - MEETING_INTERNAL_URL=${MEETING_INTERNAL_URL:-http://meeting:4003}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: qsvc-auth
    ports:
      - "4002:4002"
    environment:
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - TURN_ACCESS_SECRET=${TURN_ACCESS_SECRET:-}
      - QSVC_SSO_ENABLED=${QSVC_SSO_ENABLED:-false}
      - QSVC_SSO_AUTH_URL=${QSVC_SSO_AUTH_URL:-http://localhost:4002}
      - QSVC_SSO_WEB_URL=${QSVC_SSO_WEB_URL:-http://localhost:5173}
      - QSVC_KEYCLOAK_ISSUER=${QSVC_KEYCLOAK_ISSUER:-http://localhost:8085/realms/qsvc}
      - QSVC_KEYCLOAK_INTERNAL_URL=${QSVC_KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      - QSVC_KEYCLOAK_CLIENT_SECRET=${QSVC_KEYCLOAK_CLIENT_SECRET:-}
      - QSVC_KEYCLOAK_ADMIN_CLIENT_ID=${QSVC_KEYCLOAK_ADMIN_CLIENT_ID:-qsvc-idp-admin}
      - QSVC_KEYCLOAK_ADMIN_CLIENT_SECRET=${QSVC_KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      - QSVC_SSO_IDP_HOSTS=${QSVC_SSO_IDP_HOSTS:-}
      - QSVC_DIGILOCKER_ENABLED=${QSVC_DIGILOCKER_ENABLED:-false}
      - QSVC_DIGILOCKER_AUTHORIZE_URL=${QSVC_DIGILOCKER_AUTHORIZE_URL:-}
      - QSVC_DIGILOCKER_TOKEN_URL=${QSVC_DIGILOCKER_TOKEN_URL:-}
      - QSVC_DIGILOCKER_USER_URL=${QSVC_DIGILOCKER_USER_URL:-}
      - QSVC_DIGILOCKER_CLIENT_ID=${QSVC_DIGILOCKER_CLIENT_ID:-}
      - QSVC_DIGILOCKER_CLIENT_SECRET=${QSVC_DIGILOCKER_CLIENT_SECRET:-}
      - QSVC_DIGILOCKER_SCOPE=${QSVC_DIGILOCKER_SCOPE:-}
      - QSVC_GOOGLE_CLIENT_ID=${QSVC_GOOGLE_CLIENT_ID:-}
      - QSVC_GOOGLE_CLIENT_SECRET=${QSVC_GOOGLE_CLIENT_SECRET:-}
      - QSVC_MICROSOFT_CLIENT_ID=${QSVC_MICROSOFT_CLIENT_ID:-}
      - QSVC_MICROSOFT_CLIENT_SECRET=${QSVC_MICROSOFT_CLIENT_SECRET:-}
      - QSVC_EMAIL_API_KEY=${QSVC_EMAIL_API_KEY:-}
      - QSVC_EMAIL_FROM=${QSVC_EMAIL_FROM:-}
      - NODE_ENV=development
      - AUTH_PORT=4002
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=qsvc
      - POSTGRES_USER=qsvc
      - POSTGRES_PASSWORD=qsvc_dev_2025
      - JWT_EXPIRY=24h
      - PAYMENTS_ENABLED=${PAYMENTS_ENABLED:-false}
      - PAYMENT_TERMS_CONFIRMED=${PAYMENT_TERMS_CONFIRMED:-false}
      - PAYMENT_RETURN_URL=${PAYMENT_RETURN_URL:-http://localhost:5173}
      - AUTH_PUBLIC_URL=${AUTH_PUBLIC_URL:-}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      - RAZORPAY_PLAN_STARTER=${RAZORPAY_PLAN_STARTER:-}
      - RAZORPAY_PLAN_PRO=${RAZORPAY_PLAN_PRO:-}
      - PAYPAL_ENVIRONMENT=${PAYPAL_ENVIRONMENT:-sandbox}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - PAYPAL_WEBHOOK_ID=${PAYPAL_WEBHOOK_ID:-}
      - PAYPAL_PLAN_STARTER=${PAYPAL_PLAN_STARTER:-}
      - PAYPAL_PLAN_PRO=${PAYPAL_PLAN_PRO:-}
      - PAYPAL_CURRENCY=${PAYPAL_CURRENCY:-USD}
      - PAYPAL_STARTER_BASE_AMOUNT=${PAYPAL_STARTER_BASE_AMOUNT:-}
      - PAYPAL_PRO_BASE_AMOUNT=${PAYPAL_PRO_BASE_AMOUNT:-}
      - RAZORPAY_PLAN_BASIC=${RAZORPAY_PLAN_BASIC:-}
      - PAYPAL_PLAN_BASIC=${PAYPAL_PLAN_BASIC:-}
      - PAYPAL_PLAN_BASIC_TRIAL_14=${PAYPAL_PLAN_BASIC_TRIAL_14:-}
      - PAYPAL_BASIC_BASE_AMOUNT=${PAYPAL_BASIC_BASE_AMOUNT:-}
      - RAZORPAY_PLAN_BASIC_ANNUAL=${RAZORPAY_PLAN_BASIC_ANNUAL:-}
      - PAYPAL_PLAN_BASIC_ANNUAL=${PAYPAL_PLAN_BASIC_ANNUAL:-}
      - PAYPAL_PLAN_BASIC_ANNUAL_TRIAL_14=${PAYPAL_PLAN_BASIC_ANNUAL_TRIAL_14:-}
      - PAYPAL_BASIC_ANNUAL_BASE_AMOUNT=${PAYPAL_BASIC_ANNUAL_BASE_AMOUNT:-}
      - PAYPAL_PLAN_STARTER_TRIAL_14=${PAYPAL_PLAN_STARTER_TRIAL_14:-}
      - RAZORPAY_PLAN_STARTER_ANNUAL=${RAZORPAY_PLAN_STARTER_ANNUAL:-}
      - PAYPAL_PLAN_STARTER_ANNUAL=${PAYPAL_PLAN_STARTER_ANNUAL:-}
      - PAYPAL_PLAN_STARTER_ANNUAL_TRIAL_14=${PAYPAL_PLAN_STARTER_ANNUAL_TRIAL_14:-}
      - PAYPAL_STARTER_ANNUAL_BASE_AMOUNT=${PAYPAL_STARTER_ANNUAL_BASE_AMOUNT:-}
      - PAYPAL_PLAN_PRO_TRIAL_14=${PAYPAL_PLAN_PRO_TRIAL_14:-}
      - RAZORPAY_PLAN_PRO_ANNUAL=${RAZORPAY_PLAN_PRO_ANNUAL:-}
      - PAYPAL_PLAN_PRO_ANNUAL=${PAYPAL_PLAN_PRO_ANNUAL:-}
      - PAYPAL_PLAN_PRO_ANNUAL_TRIAL_14=${PAYPAL_PLAN_PRO_ANNUAL_TRIAL_14:-}
      - PAYPAL_PRO_ANNUAL_BASE_AMOUNT=${PAYPAL_PRO_ANNUAL_BASE_AMOUNT:-}
      - RAZORPAY_PLAN_BUSINESS=${RAZORPAY_PLAN_BUSINESS:-}
      - PAYPAL_PLAN_BUSINESS=${PAYPAL_PLAN_BUSINESS:-}
      - PAYPAL_PLAN_BUSINESS_TRIAL_14=${PAYPAL_PLAN_BUSINESS_TRIAL_14:-}
      - PAYPAL_BUSINESS_BASE_AMOUNT=${PAYPAL_BUSINESS_BASE_AMOUNT:-}
      - RAZORPAY_PLAN_BUSINESS_ANNUAL=${RAZORPAY_PLAN_BUSINESS_ANNUAL:-}
      - PAYPAL_PLAN_BUSINESS_ANNUAL=${PAYPAL_PLAN_BUSINESS_ANNUAL:-}
      - PAYPAL_PLAN_BUSINESS_ANNUAL_TRIAL_14=${PAYPAL_PLAN_BUSINESS_ANNUAL_TRIAL_14:-}
      - PAYPAL_BUSINESS_ANNUAL_BASE_AMOUNT=${PAYPAL_BUSINESS_ANNUAL_BASE_AMOUNT:-}
      - CASHFREE_ENVIRONMENT=${CASHFREE_ENVIRONMENT:-sandbox}
      - CASHFREE_API_VERSION=${CASHFREE_API_VERSION:-2026-01-01}
      - CASHFREE_CLIENT_ID=${CASHFREE_CLIENT_ID:-}
      - CASHFREE_CLIENT_SECRET=${CASHFREE_CLIENT_SECRET:-}
      - CASHFREE_WEBHOOK_SECRET=${CASHFREE_WEBHOOK_SECRET:-}
      - TURN_SECRET=dev-turn-secret-change-in-production
      - TURN_SERVERS=turn:coturn:3478
    depends_on:
      postgres:
        condition: service_healthy

  meeting:
    build:
      context: .
      dockerfile: services/meeting/Dockerfile
    container_name: qsvc-meeting
    ports:
      - "4003:4003"
    environment:
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - MEETING_POLICY_SECRET=${MEETING_POLICY_SECRET:-}
      - INVITATION_SECRET=${INVITATION_SECRET:-}
      - NODE_ENV=development
      - MEETING_PORT=4003
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=qsvc
      - POSTGRES_USER=qsvc
      - POSTGRES_PASSWORD=qsvc_dev_2025
      - WEB_URL=http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy

  recording:
    build:
      context: ./services/recording
      dockerfile: Dockerfile
    container_name: qsvc-recording
    ports:
      - "4004:4004"
    environment:
      - NODE_ENV=development
      - RECORDING_PORT=4004
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=qsvc
      - POSTGRES_USER=qsvc
      - POSTGRES_PASSWORD=qsvc_dev_2025
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=qsvc_minio
      - MINIO_SECRET_KEY=qsvc_minio_secret
      - MINIO_BUCKET=qsvc-recordings
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  web:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: qsvc-web
    ports:
      - "5173:5173"
    environment:
      - VITE_SIGNALING_URL=ws://localhost:4001/ws
      - VITE_AUTH_URL=http://localhost:4002
      - VITE_MEETING_URL=http://localhost:4003
      - VITE_RECORDING_URL=http://localhost:4004

  # ── Self-hosted AI (opt-in): docker compose --profile ai up -d asr mt ──
  # Then set ASR_URL=http://asr:8000 and LIBRETRANSLATE_URL=http://mt:5000 for signaling.
  asr:
    profiles: ["ai"]
    build:
      context: .
      dockerfile: services/asr/Dockerfile
      args:
        BASE: ${ASR_BASE_IMAGE:-python:3.11-slim}
        ONNX_RUNTIME: ${ASR_ONNX_RUNTIME:-onnxruntime==1.31.1}
    container_name: qsvc-asr
    environment:
      - NODE_ENV=development
      - QSVC_ALLOW_UNVERIFIED_MODELS=${QSVC_ALLOW_UNVERIFIED_MODELS:-false}
      - ASR_MODEL=${ASR_MODEL:-/models/whisper}
      - ASR_INDIC_MODEL=${ASR_INDIC_MODEL:-/models/indic}
      - ASR_LANGUAGES=${ASR_LANGUAGES:-}
      - ASR_PROMPT=${ASR_PROMPT:-}
      - ASR_API_KEY=${ASR_API_KEY:-}
      - ASR_ENGINE=${ASR_ENGINE:-hybrid}
      - ASR_INDIC_LANGUAGES=${ASR_INDIC_LANGUAGES:-}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - asr_models:/models
    restart: unless-stopped
    # GPU: uncomment and build with ASR_BASE_IMAGE=nvidia/cuda:12.4.1-cudnn-runtime-ubuntu22.04
    # deploy: { resources: { reservations: { devices: [ { driver: nvidia, count: 1, capabilities: [gpu] } ] } } }

  mt:
    profiles: ["ai"]
    build:
      context: .
      dockerfile: services/mt/Dockerfile
      args:
        BASE: ${MT_BASE_IMAGE:-python:3.11-slim}
    container_name: qsvc-mt
    environment:
      - NODE_ENV=development
      - QSVC_ALLOW_UNVERIFIED_MODELS=${QSVC_ALLOW_UNVERIFIED_MODELS:-false}
      - MT_MODEL_EN_INDIC=${MT_MODEL_EN_INDIC:-/models/en-indic}
      - MT_MODEL_INDIC_EN=${MT_MODEL_INDIC_EN:-/models/indic-en}
      - MT_LANGUAGES=${MT_LANGUAGES:-}
      - MT_API_KEY=${LIBRETRANSLATE_API_KEY:-}
      - MT_GLOSSARY_FILE=/app/glossary.example.json
    volumes:
      - mt_models:/models
    restart: unless-stopped
    # deploy: { resources: { reservations: { devices: [ { driver: nvidia, count: 1, capabilities: [gpu] } ] } } }

volumes:
  keycloak-data:
  asr_models:
  mt_models:

networks:
  keycloak-db:
    internal: true
