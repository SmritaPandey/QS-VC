# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# QS-VC Core Services — Docker Compose
# Includes: PostgreSQL, Redis, MinIO, Coturn, Core Microservices, Web, and Caddy
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: qsvc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qsvc}
      POSTGRES_USER: ${POSTGRES_USER:-qsvc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qsvc_secure_pass_2026}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qsvc} -d ${POSTGRES_DB:-qsvc}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - qsvc-net

  redis:
    image: redis:7-alpine
    container_name: qsvc-redis
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD:-qsvc_redis_2026}"
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-qsvc_redis_2026}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - qsvc-net

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: qsvc-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-qsvc_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-qsvc_minio_secret_2026}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - qsvc-net

  coturn:
    image: coturn/coturn:4.6.2-alpine
    container_name: qsvc-coturn
    restart: unless-stopped
    network_mode: host
    environment:
      TURN_SECRET: ${TURN_SECRET:-dev-turn-secret-change-in-production}
      EXTERNAL_IP: ${SFU_ANNOUNCED_IP:-127.0.0.1}

  auth:
    image: qsvc-core:${QSVC_VERSION:-latest}
    container_name: qsvc-auth
    restart: unless-stopped
    command: ["node", "services/auth/server.js"]
    env_file:
      - ${QSVC_CONFIG_FILE:-../config/.env}
    environment:
      NODE_ENV: production
      QSVC_DEPLOYMENT: onprem
      PORT: 4002
    ports:
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - qsvc-net

  meeting:
    image: qsvc-core:${QSVC_VERSION:-latest}
    container_name: qsvc-meeting
    restart: unless-stopped
    command: ["node", "services/meeting/server.js"]
    env_file:
      - ${QSVC_CONFIG_FILE:-../config/.env}
    environment:
      NODE_ENV: production
      QSVC_DEPLOYMENT: onprem
      PORT: 4003
    ports:
      - "4003:4003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - qsvc-net

  signaling:
    image: qsvc-core:${QSVC_VERSION:-latest}
    container_name: qsvc-signaling
    restart: unless-stopped
    command: ["node", "services/signaling/server.js"]
    env_file:
      - ${QSVC_CONFIG_FILE:-../config/.env}
    environment:
      NODE_ENV: production
      QSVC_DEPLOYMENT: onprem
      PORT: 4001
      SFU_URL: http://sfu:4000
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - qsvc-net

  sfu:
    image: qsvc-core:${QSVC_VERSION:-latest}
    container_name: qsvc-sfu
    restart: unless-stopped
    network_mode: host
    command: ["node", "services/sfu/server.js"]
    env_file:
      - ${QSVC_CONFIG_FILE:-../config/.env}
    environment:
      NODE_ENV: production
      QSVC_DEPLOYMENT: onprem
      PORT: 4000
      SFU_ANNOUNCED_IP: ${SFU_ANNOUNCED_IP:-127.0.0.1}
      SFU_MIN_PORT: 40000
      SFU_MAX_PORT: 49999

  recording:
    image: qsvc-core:${QSVC_VERSION:-latest}
    container_name: qsvc-recording
    restart: unless-stopped
    command: ["node", "services/recording/server.js"]
    env_file:
      - ${QSVC_CONFIG_FILE:-../config/.env}
    environment:
      NODE_ENV: production
      QSVC_DEPLOYMENT: onprem
      PORT: 4004
    ports:
      - "4004:4004"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - qsvc-net

  web:
    image: nginx:alpine
    container_name: qsvc-web
    restart: unless-stopped
    volumes:
      - ../build/frontend/web:/usr/share/nginx/html:ro
      - ../config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5173:80"
    networks:
      - qsvc-net

  caddy:
    image: caddy:2-alpine
    container_name: qsvc-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - auth
      - meeting
      - signaling
      - web
    networks:
      - qsvc-net

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:

networks:
  qsvc-net:
    driver: bridge

