
name: QSVC Production Deployment

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'db/**'
      - 'deploy/aws/**'
      - 'frontend/desktop/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qsvc-production-deployment
  cancel-in-progress: false

jobs:
  changes:
    name: Detect release changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          backend: |
            services/**
            db/**
            deploy/aws/**
          desktop: frontend/desktop/**

  verify:
    name: Verify production revision
    uses: ./.github/workflows/ci.yml

  build-installers:
    name: Build Windows and Mac installers
    needs: [verify, changes]
    if: needs.changes.outputs.desktop == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout approved source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci --prefix frontend/desktop

      - name: Build Apple silicon app
        run: npm --prefix frontend/desktop run package:mac:arm64

      - name: Build Intel app
        run: npm --prefix frontend/desktop run package:mac:x64

      - name: Package the verified Windows installer as ZIP
        shell: bash
        run: |
          set -euo pipefail
          release=frontend/desktop/release
          cat \
            deploy/aws/outgoing/QS-VC-Windows-Setup.exe.part00 \
            deploy/aws/outgoing/QS-VC-Windows-Setup.exe.part01 \
            deploy/aws/outgoing/QS-VC-Windows-Setup.exe.part02 \
            deploy/aws/outgoing/QS-VC-Windows-Setup.exe.part03 \
            > "$release/QS-VC-Windows-Setup.exe"
          printf '%s  %s\n' \
            '807796fb30b062e5fdee1b028b8c51d21dabb72aef7b4f0fe6b6cf8e516c0b45' \
            "$release/QS-VC-Windows-Setup.exe" \
            | shasum -a 256 --check
          printf '%s  %s\n' \
            '807796fb30b062e5fdee1b028b8c51d21dabb72aef7b4f0fe6b6cf8e516c0b45' \
            'QS-VC-Windows-Setup.exe' \
            > "$release/QS-VC-Windows-Setup.exe.sha256"
          python3 - "$release" <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile
          import sys

          release = Path(sys.argv[1])
          archive = release / 'QS-VC-Windows-x64.zip'
          with ZipFile(archive, 'w', ZIP_DEFLATED) as bundle:
              bundle.write(release / 'QS-VC-Windows-Setup.exe', 'QS-VC-Windows-Setup.exe')
              bundle.write(release / 'QS-VC-Windows-Setup.exe.sha256', 'QS-VC-Windows-Setup.exe.sha256')
          PY

      - name: Verify and checksum installer archives
        shell: bash
        run: |
          set -euo pipefail
          cd frontend/desktop/release
          unzip -t QS-VC-Windows-x64.zip
          unzip -t QS-VC-macOS-arm64.zip
          unzip -t QS-VC-macOS-x64.zip
          shasum -a 256 QS-VC-Windows-x64.zip > QS-VC-Windows-x64.zip.sha256
          shasum -a 256 QS-VC-macOS-arm64.zip > QS-VC-macOS-arm64.zip.sha256
          shasum -a 256 QS-VC-macOS-x64.zip > QS-VC-macOS-x64.zip.sha256

      - name: Upload platform installers
        uses: actions/upload-artifact@v4
        with:
          name: qsvc-platform-installers
          path: |
            frontend/desktop/release/QS-VC-Windows-x64.zip
            frontend/desktop/release/QS-VC-Windows-x64.zip.sha256
            frontend/desktop/release/QS-VC-macOS-arm64.zip
            frontend/desktop/release/QS-VC-macOS-arm64.zip.sha256
            frontend/desktop/release/QS-VC-macOS-x64.zip
            frontend/desktop/release/QS-VC-macOS-x64.zip.sha256
          if-no-files-found: error
          retention-days: 7

  build-linux-installer:
    name: Build Linux x64 desktop archive
    needs: [verify, changes]
    if: needs.changes.outputs.desktop == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout approved source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci --prefix frontend/desktop

      - name: Build Linux x64 archive
        run: npm --prefix frontend/desktop run package:linux:x64

      - name: Verify and checksum Linux archive
        run: |
          set -euo pipefail
          cd frontend/desktop/release
          tar -tzf QS-VC-Linux-x64.tar.gz >/dev/null
          sha256sum QS-VC-Linux-x64.tar.gz > QS-VC-Linux-x64.tar.gz.sha256

      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: qsvc-linux-installer
          path: |
            frontend/desktop/release/QS-VC-Linux-x64.tar.gz
            frontend/desktop/release/QS-VC-Linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: [verify, changes, build-installers, build-linux-installer]
    if: >-
      always() && needs.verify.result == 'success' &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.desktop == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.build-installers.result == 'success' || needs.build-installers.result == 'skipped') &&
      (needs.build-linux-installer.result == 'success' || needs.build-linux-installer.result == 'skipped')
    name: Deploy QSVC to AWS
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ap-south-1
      RELEASE_SHA: ${{ github.sha }}
      DEPLOY_BUCKET: ${{ vars.QSVC_DEPLOY_BUCKET }}
      EC2_INSTANCE_ID: ${{ vars.QSVC_EC2_INSTANCE_ID }}

    steps:
      - name: Checkout approved source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download platform installers
        if: needs.build-installers.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: qsvc-platform-installers
          path: /tmp/qsvc-platform-installers

      - name: Download Linux installer
        if: needs.build-linux-installer.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: qsvc-linux-installer
          path: /tmp/qsvc-platform-installers

      - name: Validate deployment files
        shell: bash
        run: |
          set -euo pipefail

          test -f deploy/aws/compose.yml
          test -f deploy/aws/Dockerfile
          test -f db/migrate.js
          test -f db/migrations/006_enterprise_access_terms.sql
          test -f db/migrations/013_linux_desktop_support.sql

          echo "Required deployment files found"

      - name: Check migration filenames
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          files = sorted(
              p.name for p in Path("db/migrations").glob("*.sql")
          )

          assert files, "No migration files found"
          assert len(files) == len(set(files))

          for filename in files:
              print("Migration:", filename)
          PY

      - name: Check GitHub deployment role configuration
        env:
          DEPLOY_ROLE_ARN: ${{ vars.QSVC_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_ROLE_ARN" ]]; then
            echo "QSVC_DEPLOY_ROLE_ARN is missing. Add it as a GitHub Actions variable for the production environment (or repository)."
            exit 1
          fi

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.QSVC_DEPLOY_ROLE_ARN }}
          role-session-name: qsvc-production-deploy

      - name: Verify AWS deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$DEPLOY_BUCKET" ]]; then
            echo "QSVC_DEPLOY_BUCKET is missing. Set it as a GitHub Actions variable for the production environment (or repository)."
            exit 1
          fi
          if [[ -z "$EC2_INSTANCE_ID" ]]; then
            echo "QSVC_EC2_INSTANCE_ID is missing. Set it as a GitHub Actions variable for the production environment (or repository)."
            exit 1
          fi

          aws sts get-caller-identity \
            --query '{Account:Account,Arn:Arn}'

          PING_STATUS=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$EC2_INSTANCE_ID" \
            --query 'InstanceInformationList[].PingStatus' \
            --output text)
          if [[ "$PING_STATUS" != "Online" ]]; then
            echo "EC2 instance $EC2_INSTANCE_ID is not online in Systems Manager (PingStatus: ${PING_STATUS:-not registered}). Check its SSM agent, instance role, and network access."
            exit 1
          fi

      - name: Package approved source
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_DIR="/tmp/qsvc-release-source"
          mkdir -p "$RELEASE_DIR/deploy/aws/installers"
          git archive --format=tar "$RELEASE_SHA" | tar -x -C "$RELEASE_DIR"
          if [[ "${{ needs.build-installers.result }}" == success ]]; then
            install -m 0644 /tmp/qsvc-platform-installers/QS-VC-Windows-x64.zip "$RELEASE_DIR/deploy/aws/installers/"
            install -m 0644 /tmp/qsvc-platform-installers/QS-VC-Windows-x64.zip.sha256 "$RELEASE_DIR/deploy/aws/installers/"
            install -m 0644 /tmp/qsvc-platform-installers/QS-VC-macOS-arm64.zip "$RELEASE_DIR/deploy/aws/installers/"
            install -m 0644 /tmp/qsvc-platform-installers/QS-VC-macOS-arm64.zip.sha256 "$RELEASE_DIR/deploy/aws/installers/"
            install -m 0644 /tmp/qsvc-platform-installers/QS-VC-macOS-x64.zip "$RELEASE_DIR/deploy/aws/installers/"
            install -m 0644 /tmp/qsvc-platform-installers/QS-VC-macOS-x64.zip.sha256 "$RELEASE_DIR/deploy/aws/installers/"
          fi
          if [[ "${{ needs.build-linux-installer.result }}" == success ]]; then
            install -m 0644 /tmp/qsvc-platform-installers/QS-VC-Linux-x64.tar.gz "$RELEASE_DIR/deploy/aws/installers/"
            install -m 0644 /tmp/qsvc-platform-installers/QS-VC-Linux-x64.tar.gz.sha256 "$RELEASE_DIR/deploy/aws/installers/"
          fi
          tar -czf /tmp/qsvc-release.tar.gz -C "$RELEASE_DIR" .

          sha256sum /tmp/qsvc-release.tar.gz \
            | awk '{print $1}' \
            > /tmp/qsvc-release.sha256

          echo "Release archive created"

      - name: Upload release to private S3
        id: upload
        shell: bash
        run: |
          set -euo pipefail

          KEY="qsvc/releases/${RELEASE_SHA}.tar.gz"
          URI="s3://${DEPLOY_BUCKET}/${KEY}"

          aws s3 cp \
            /tmp/qsvc-release.tar.gz \
            "$URI" \
            --sse AES256

          echo "uri=$URI" >> "$GITHUB_OUTPUT"

      - name: Trigger EC2 deployment through SSM
        id: ssm
        shell: bash
        env:
          RELEASE_URI: ${{ steps.upload.outputs.uri }}
        run: |
          set -euo pipefail

          CHECKSUM="$(cat /tmp/qsvc-release.sha256)"

          # Only controlled commit hashes, checksum and
          # S3 release URI are passed to the host.
          COMMAND=$(printf \
            'sudo /usr/local/sbin/qsvc-deploy-release "%s" "%s" "%s"' \
            "$RELEASE_URI" "$RELEASE_SHA" "$CHECKSUM")

          jq -n \
            --arg cmd "$COMMAND" \
            '{
              commands: [$cmd],
              executionTimeout: ["3600"]
            }' > /tmp/ssm-params.json

          COMMAND_ID=$(
            aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters file:///tmp/ssm-params.json \
              --comment "QSVC approved production deployment" \
              --query 'Command.CommandId' \
              --output text
          )

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command submitted: $COMMAND_ID"

      - name: Wait for deployment result
        shell: bash
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 120); do
            if ! STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>/tmp/qsvc-ssm-poll-error); then
              if grep -q 'InvocationDoesNotExist' /tmp/qsvc-ssm-poll-error; then
                echo "SSM has not published invocation status yet (attempt $attempt/120)"
                sleep 5
                continue
              fi
              cat /tmp/qsvc-ssm-poll-error >&2
              exit 1
            fi

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment succeeded"
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed; remote command output follows:"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,ResponseCode:ResponseCode,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
              Pending|InProgress|Delayed)
                sleep 20
                ;;
              *)
                echo "Unknown SSM status: $STATUS"
                exit 1
                ;;
            esac
          done

          echo "Deployment polling timed out"
          exit 1

      - name: Deployment summary
        if: always()
        shell: bash
        env:
          DEPLOY_RESULT: ${{ job.status }}
        run: |
          {
            echo "## QSVC Production Deployment"
            echo ""
            echo "- Commit: \`$RELEASE_SHA\`"
            echo "- Region: \`$AWS_REGION\`"
            echo "- Result: \`$DEPLOY_RESULT\`"
          } >> "$GITHUB_STEP_SUMMARY"
