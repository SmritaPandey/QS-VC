# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# QS-VC Single-Box Deployment — All-In-One Docker Compose
# Runs Core Services + CPU AI + MCU on a single server (e.g. Rocky Linux 9)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
version: '3.8'

services:
  keycloak-db:
    extends: { file: ../deploy/keycloak/compose.yml, service: keycloak-db }
    volumes:
      - keycloak-data:/var/lib/postgresql/data
      - ../deploy/keycloak/init-db.sql:/docker-entrypoint-initdb.d/01-keycloak.sql:ro
  keycloak:
    extends: { file: ../deploy/keycloak/compose.yml, service: keycloak }
    environment:
      QSVC_SSO_AUTH_URL: ${QSVC_SSO_AUTH_URL:-http://localhost:4002}
    volumes:
      - ../deploy/keycloak/qsvc-realm.json:/opt/keycloak/data/import/qsvc-realm.json:ro
    networks: [qsvc-net, keycloak-db]
  # ── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: qsvc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qsvc}
      POSTGRES_USER: ${POSTGRES_USER:-qsvc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qsvc_secure_pass_2026}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qsvc} -d ${POSTGRES_DB:-qsvc}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - qsvc-net

  redis:
    image: redis:7-alpine
    container_name: qsvc-redis
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD:-qsvc_redis_2026}"
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-qsvc_redis_2026}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - qsvc-net

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: qsvc-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-qsvc_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-qsvc_minio_secret_2026}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "9001:9001"
    networks:
      - qsvc-net

  coturn:
    entrypoint: [sh, /etc/coturn/start.sh]
    volumes:
      - ../deploy/turn/start.sh:/etc/coturn/start.sh:ro
      - ../deploy/turn/peer-policy.conf:/etc/coturn/peer-policy.conf:ro
    environment:
      TURN_SECRET: ${TURN_SECRET:?Set a private shared TURN secret}
      TURN_REALM: ${TURN_REALM:-qsvc}
      SFU_ANNOUNCED_IP: ${SFU_ANNOUNCED_IP:-}
      TURN_ALLOWED_SFU_IP: ${TURN_ALLOWED_SFU_IP:-}
    image: coturn/coturn:4.6.2-alpine
    container_name: qsvc-coturn
    restart: unless-stopped
    network_mode: host

  # ── Core Services ───────────────────────────────────────────────────────────
  auth:
    secrets: [session_signing_key]
    image: qsvc-core:${QSVC_VERSION:-latest}
    container_name: qsvc-auth
    restart: unless-stopped
    command: ["node", "services/auth/server.js"]
    env_file:
      - ${QSVC_CONFIG_FILE:-../config/.env}
    environment:
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:-}
      TURN_ACCESS_SECRET: ${TURN_ACCESS_SECRET:-}
      SESSION_SIGNING_KEY_FILE: /run/secrets/session_signing_key
      QSVC_SSO_ENABLED: ${QSVC_SSO_ENABLED:-false}
      QSVC_SSO_AUTH_URL: ${QSVC_SSO_AUTH_URL:-http://localhost:4002}
      QSVC_SSO_WEB_URL: ${QSVC_SSO_WEB_URL:-http://localhost:5173}
      QSVC_KEYCLOAK_ISSUER: ${QSVC_KEYCLOAK_ISSUER:-http://localhost:8085/realms/qsvc}
      QSVC_KEYCLOAK_INTERNAL_URL: ${QSVC_KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      QSVC_KEYCLOAK_CLIENT_SECRET: ${QSVC_KEYCLOAK_CLIENT_SECRET:-}
      QSVC_KEYCLOAK_ADMIN_CLIENT_ID: ${QSVC_KEYCLOAK_ADMIN_CLIENT_ID:-qsvc-idp-admin}
      QSVC_KEYCLOAK_ADMIN_CLIENT_SECRET: ${QSVC_KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      QSVC_SSO_IDP_HOSTS: ${QSVC_SSO_IDP_HOSTS:-}
      QSVC_DIGILOCKER_ENABLED: ${QSVC_DIGILOCKER_ENABLED:-false}
      QSVC_DIGILOCKER_AUTHORIZE_URL: ${QSVC_DIGILOCKER_AUTHORIZE_URL:-}
      QSVC_DIGILOCKER_TOKEN_URL: ${QSVC_DIGILOCKER_TOKEN_URL:-}
      QSVC_DIGILOCKER_USER_URL: ${QSVC_DIGILOCKER_USER_URL:-}
      QSVC_DIGILOCKER_CLIENT_ID: ${QSVC_DIGILOCKER_CLIENT_ID:-}
      QSVC_DIGILOCKER_CLIENT_SECRET: ${QSVC_DIGILOCKER_CLIENT_SECRET:-}
      QSVC_DIGILOCKER_SCOPE: ${QSVC_DIGILOCKER_SCOPE:-}
      QSVC_GOOGLE_CLIENT_ID: ${QSVC_GOOGLE_CLIENT_ID:-}
      QSVC_GOOGLE_CLIENT_SECRET: ${QSVC_GOOGLE_CLIENT_SECRET:-}
      QSVC_MICROSOFT_CLIENT_ID: ${QSVC_MICROSOFT_CLIENT_ID:-}
      QSVC_MICROSOFT_CLIENT_SECRET: ${QSVC_MICROSOFT_CLIENT_SECRET:-}
      QSVC_EMAIL_API_KEY: ${QSVC_EMAIL_API_KEY:-}
      QSVC_EMAIL_FROM: ${QSVC_EMAIL_FROM:-}
      NODE_ENV: production
      QSVC_DEPLOYMENT: onprem
      PORT: 4002
    ports:
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - qsvc-net

  meeting:
    image: qsvc-core:${QSVC_VERSION:-latest}
    container_name: qsvc-meeting
    restart: unless-stopped
    command: ["node", "services/meeting/server.js"]
    env_file:
      - ${QSVC_CONFIG_FILE:-../config/.env}
    environment:
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:-}
      MEETING_POLICY_SECRET: ${MEETING_POLICY_SECRET:-}
      INVITATION_SECRET: ${INVITATION_SECRET:-}
      NODE_ENV: production
      QSVC_DEPLOYMENT: onprem
      PORT: 4003
    ports:
      - "4003:4003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - qsvc-net

  signaling:
    image: qsvc-core:${QSVC_VERSION:-latest}
    container_name: qsvc-signaling
    restart: unless-stopped
    command: ["node", "services/signaling/server.js"]
    env_file:
      - ${QSVC_CONFIG_FILE:-../config/.env}
    environment:
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:-}
      MEETING_POLICY_SECRET: ${MEETING_POLICY_SECRET:-}
      INVITATION_SECRET: ${INVITATION_SECRET:-}
      TURN_ACCESS_SECRET: ${TURN_ACCESS_SECRET:-}
      NODE_ENV: production
      QSVC_DEPLOYMENT: onprem
      PORT: 4001
      SFU_URL: http://127.0.0.1:4000
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  sfu:
    image: qsvc-core:${QSVC_VERSION:-latest}
    container_name: qsvc-sfu
    restart: unless-stopped
    network_mode: host
    command: ["node", "services/sfu/server.js"]
    env_file:
      - ${QSVC_CONFIG_FILE:-../config/.env}
    environment:
      NODE_ENV: production
      QSVC_DEPLOYMENT: onprem
      PORT: 4000
      SFU_ANNOUNCED_IP: ${SFU_ANNOUNCED_IP:-127.0.0.1}
      SFU_MIN_PORT: 40000
      SFU_MAX_PORT: 40100

  recording:
    image: qsvc-core:${QSVC_VERSION:-latest}
    container_name: qsvc-recording
    restart: unless-stopped
    command: ["node", "services/recording/server.js"]
    env_file:
      - ${QSVC_CONFIG_FILE:-../config/.env}
    environment:
      NODE_ENV: production
      QSVC_DEPLOYMENT: onprem
      PORT: 4004
    ports:
      - "4004:4004"
    networks:
      - qsvc-net

  web:
    image: nginx:alpine
    container_name: qsvc-web
    restart: unless-stopped
    volumes:
      - ../build/frontend/web:/usr/share/nginx/html:ro
      - ../config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5173:80"
    networks:
      - qsvc-net

  # ── AI Services (CPU Fallback) ──────────────────────────────────────────────
  asr-cpu:
    image: qsvc-ai-cpu:${QSVC_VERSION:-latest}
    container_name: qsvc-asr-cpu
    restart: unless-stopped
    command: ["python3", "services/asr/server.py"]
    env_file:
      - ${QSVC_CONFIG_FILE:-../config/.env}
    environment:
      DEVICE: cpu
      PORT: 5001
      ASR_MODEL: tiny
    ports:
      - "5001:5001"
    networks:
      - qsvc-net

  mt-cpu:
    image: qsvc-ai-cpu:${QSVC_VERSION:-latest}
    container_name: qsvc-mt-cpu
    restart: unless-stopped
    command: ["python3", "services/mt/server.py"]
    env_file:
      - ${QSVC_CONFIG_FILE:-../config/.env}
    environment:
      DEVICE: cpu
      PORT: 5000
    ports:
      - "5000:5000"
    networks:
      - qsvc-net

  # ── MCU (FreeSWITCH + Poly Bridge) ──────────────────────────────────────────
  freeswitch:
    image: qsvc-mcu:${QSVC_VERSION:-latest}
    container_name: qsvc-freeswitch
    restart: unless-stopped
    network_mode: host
    environment:
      FS_ESL_PASSWORD: ${FS_ESL_PASSWORD:-ClueCon}
      FS_ESL_PORT: ${FS_ESL_PORT:-8021}
    volumes:
      - ../config/freeswitch/dialplan:/etc/freeswitch/dialplan:ro
      - ../config/freeswitch/directory:/etc/freeswitch/directory:ro
      - ../config/freeswitch/sip_profiles:/etc/freeswitch/sip_profiles:ro
      - freeswitch-recordings:/var/lib/freeswitch/recordings

  poly-bridge:
    image: qsvc-core:${QSVC_VERSION:-latest}
    container_name: qsvc-poly-bridge
    restart: unless-stopped
    command: ["node", "deploy/poly-bridge/server.js"]
    env_file:
      - ${QSVC_CONFIG_FILE:-../config/.env}
    environment:
      NODE_ENV: production
      QSVC_DEPLOYMENT: onprem
      FS_ESL_HOST: 127.0.0.1
      FS_ESL_PORT: 8021
      FS_ESL_PASSWORD: ${FS_ESL_PASSWORD:-ClueCon}
      BRIDGE_API_TOKEN: ${BRIDGE_API_TOKEN:-dev-bridge-secret-2026}
      BRIDGE_RTP_ANNOUNCED_IP: ${SFU_ANNOUNCED_IP:-127.0.0.1}
      SFU_URL: http://127.0.0.1:4000
      SIGNALING_URL: http://127.0.0.1:4001
    network_mode: host
    depends_on:
      - freeswitch

  # ── Reverse Proxy (Caddy) ───────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: qsvc-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - qsvc-net

volumes:
  keycloak-data:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
  freeswitch-recordings:

networks:
  keycloak-db:
    internal: true
  qsvc-net:
    driver: bridge


secrets:
  session_signing_key:
    file: ${SESSION_SIGNING_KEY_FILE:?Set the Ed25519 auth signing key file}
