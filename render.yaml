# render.yaml — Render.com Blueprint for QS-VC
# Deploy: Connect this repo on https://dashboard.render.com/blueprints
# Docs: https://docs.render.com/infrastructure-as-code

databases:
  - name: qsvc-db
    plan: free
    databaseName: qsvc
    user: qsvc
    ipAllowList: []  # Internal Render services only; no external database access.

services:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # AUTH SERVICE
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - type: web
    name: qsvc-auth
    runtime: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./services/auth/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_DATABASE_URL
        sync: false # Set to the qs_auth_app connection string, never the migration/admin URL.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: "24h"
      - key: TURN_SECRET
        sync: false
      - key: TURN_SERVERS
        value: "stun:stun.l.google.com:19302"
      - key: CORS_ORIGINS
        value: "https://qs-vc.vercel.app,https://dist-puce-one-68.vercel.app"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # SIGNALING SERVICE
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - type: web
    name: qsvc-signaling
    runtime: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./services/signaling/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WS_TRUST_PROXY_HEADER
        value: x-forwarded-for
      - key: JWT_SECRET
        sync: false  # Must match auth service
      - key: AUTH_INTERNAL_URL
        value: "http://qsvc-auth:4002"
      - key: MEETING_INTERNAL_URL
        value: "http://qsvc-meeting:4003"
      - key: WS_TICKET_STORE
        value: memory # Signaling room state is process-local; keep this service at one instance unless Redis is configured.
      - key: WEB_URL
        value: "https://qs-vc.vercel.app"
      - key: CORS_ORIGINS
        value: "https://qs-vc.vercel.app,https://dist-puce-one-68.vercel.app"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # MEETING SERVICE
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - type: web
    name: qsvc-meeting
    runtime: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./services/meeting/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MEETING_DATABASE_URL
        sync: false # Set to the qs_meeting_app connection string, never the migration/admin URL.
      - key: JWT_SECRET
        sync: false  # Must match auth service
      - key: AUTH_INTERNAL_URL
        value: "http://qsvc-auth:4002"
      - key: WEB_URL
        value: "https://qs-vc.vercel.app"
      - key: CORS_ORIGINS
        value: "https://qs-vc.vercel.app,https://dist-puce-one-68.vercel.app"
