<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description"
    content="QS-VC: a workspace for video meetings, scheduling and conversation." />
  <meta name="theme-color" content="#f5f8fa" />
  <script src="/theme.js"></script>
  <title>QS-VC | Video meetings</title>
  <style>
    html.qsvc-boot #root { visibility: hidden; }
    html { --boot-bg:#f5f8fa; --boot-ink:#102a43; --boot-muted:#526676; background:var(--boot-bg); }
    html[data-theme="dark"] { --boot-bg:#0b1420; --boot-ink:#edf5fa; --boot-muted:#b6c8d5; }
    #qsvc-startup { position: fixed; inset: 0; z-index: 2000; display: grid; place-items: center; background: var(--boot-bg); color: var(--boot-ink); font: 16px/1.6 Arial, sans-serif; }
    #qsvc-startup .boot-content { width: min(280px, calc(100% - 48px)); text-align: center; }
    .boot-mark { display: flex; gap: 12px; align-items: center; justify-content: center; min-height: 56px; margin-bottom: 12px; }
    .boot-symbol { width: 48px; height: 48px; flex-shrink: 0; overflow: visible; }
    .boot-ring { stroke-dasharray: 160; stroke-dashoffset: 0; animation: boot-ring-trace 3s ease-in-out infinite; }
    .boot-play, .boot-tail { animation: boot-symbol-arrive 650ms ease-out 250ms both; }
    .boot-wordmark { font-size: 28px; font-weight: 600; letter-spacing: -.04em; line-height: 1.2; color: #102A43; background: linear-gradient(110deg,#233c86,#006d77); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: boot-wordmark-arrive 800ms cubic-bezier(.165,.84,.44,1) 300ms both; }
    html[data-theme="dark"] .boot-wordmark { background:none; -webkit-text-fill-color:var(--boot-ink); color:var(--boot-ink); }
    .boot-lines { position: relative; height: 44px; color: var(--boot-muted); font-size: 14px; line-height: 1.5; }
    .boot-lines>span { position: absolute; inset: 0; display: grid; place-items: start center; opacity: 0; animation: boot-line-change 6s ease-in-out infinite both; }
    .boot-lines>span:nth-child(2) { animation-delay: 2s; }
    .boot-lines>span:nth-child(3) { animation-delay: 4s; }
    #qsvc-startup .boot-sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    #qsvc-startup[data-slow] .boot-ring { animation: none; }
    #qsvc-startup p { margin: 8px 0 0; }
    #qsvc-startup a, #qsvc-startup button { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 8px 16px; border: 1px solid currentColor; border-radius: 4px 14px; color: inherit; background: transparent; font: inherit; margin: 16px 8px 0 0; cursor: pointer; }
    #qsvc-startup [hidden] { display: none; }
    #qsvc-startup a:focus-visible, #qsvc-startup button:focus-visible { outline: 2px solid #006D77; outline-offset: 3px; }
    @keyframes boot-ring-trace { 0%,100% { stroke-dashoffset: 0; opacity: 1; } 50% { stroke-dashoffset: 28; opacity: .7; } }
    @keyframes boot-line-change { 0% { opacity: 0; transform: translateY(5px); } 4%,28% { opacity: 1; transform: translateY(0); } 33%,100% { opacity: 0; transform: translateY(-5px); } }
    @keyframes boot-symbol-arrive { from { opacity: 0; } to { opacity: 1; } }
    @keyframes boot-wordmark-arrive { from { opacity: 0; transform: translateX(16px); clip-path: inset(0 100% 0 0); } to { opacity: 1; transform: translateX(0); clip-path: inset(0); } }
    @media (prefers-reduced-motion: reduce) { .boot-ring, .boot-play, .boot-tail, .boot-wordmark, .boot-lines>span { animation: none; } .boot-lines>span:first-child { opacity: 1; } .boot-lines>span:not(:first-child) { display: none; } }
    @media (forced-colors: active) { .boot-wordmark { background: none; -webkit-text-fill-color: currentColor; } }
  </style>
  <script>
    document.documentElement.classList.add('qsvc-boot');
    var qsvcBootStarted = performance.now();
    window.addEventListener('qsvc:ready', function () {
      clearTimeout(window.qsvcBootTimeout);
      var remaining = window.matchMedia('(prefers-reduced-motion: reduce)').matches
        ? 0 : Math.max(0, 3000 - (performance.now() - qsvcBootStarted));
      setTimeout(function () {
        document.documentElement.classList.remove('qsvc-boot');
        document.getElementById('qsvc-startup')?.remove();
      }, remaining);
    }, { once: true });
    window.qsvcBootTimeout = setTimeout(function () {
      document.documentElement.classList.remove('qsvc-boot');
      var overlay = document.getElementById('qsvc-startup');
      if (!overlay) return;
      overlay.setAttribute('data-slow', '');
      overlay.querySelector('[data-boot-lines]').hidden = true;
      overlay.querySelector('[data-boot-status]').classList.remove('boot-sr-only');
      overlay.querySelector('[data-boot-status]').textContent = 'Taking longer than expected. Reload or continue with available content.';
      overlay.querySelector('[data-boot-recovery]').hidden = false;
      overlay.querySelector('[data-boot-continue]').hidden = !document.getElementById('root')?.hasChildNodes();
    }, 8000);
  </script>
</head>

<body>
  <div id="qsvc-startup"><div class="boot-content"><div class="boot-mark" aria-hidden="true"><svg class="boot-symbol" viewBox="0 0 64 64" focusable="false"><defs><linearGradient id="boot-ring-gradient" x1="12" y1="5" x2="52" y2="60" gradientUnits="userSpaceOnUse"><stop stop-color="#5141BE"/><stop offset="1" stop-color="#6323AA"/></linearGradient><linearGradient id="boot-play-gradient" x1="22" y1="32" x2="44" y2="32" gradientUnits="userSpaceOnUse"><stop stop-color="#20528A"/><stop offset=".55" stop-color="#079C9A"/><stop offset="1" stop-color="#20528A"/></linearGradient></defs><path class="boot-ring" d="M47 50 A25 25 0 1 1 53 43" fill="none" stroke="url(#boot-ring-gradient)" stroke-width="6"/><path class="boot-play" d="M23 21 Q22 20 22 23 L22 42 Q22 44 24 43 L44 34 Q47 32.5 44 31 Z" fill="url(#boot-play-gradient)"/><path class="boot-tail" d="M44 47 Q42 45 41 48 L49 61 Q50 63 52 61 L61 55 Q63 54 60 52 L46 46 Z" fill="url(#boot-ring-gradient)" stroke="#F5F8FA" stroke-width="1.5"/></svg><span class="boot-wordmark">QS-VC</span></div><div class="boot-lines" data-boot-lines aria-hidden="true"><span>Opening QS-VC…</span><span>Your next conversation starts here.</span><span>A little more connection.</span></div><p class="boot-sr-only" role="status" data-boot-status>Opening QS-VC…</p><div data-boot-recovery hidden><a href="">Reload page</a><button data-boot-continue onclick="document.getElementById('qsvc-startup').remove()">Continue</button></div></div></div>
  <noscript><style>html.qsvc-boot #root { visibility: visible; } #qsvc-startup { display: none; }</style><p>QS-VC needs JavaScript to open meetings. Enable it and reload this page.</p></noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
