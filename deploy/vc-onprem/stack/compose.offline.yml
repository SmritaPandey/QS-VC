services:
  ai-gateway:
    profiles: [ai-gateway]
    image: qsvc-auth:intranet
    entrypoint: ["node", "/opt/qsvc-ai/gateway.cjs"]
    user: "65534:65534"
    read_only: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./ai:/opt/qsvc-ai:ro
      - /var/lib/qsvc/ai:/ai-config:ro
  trial-gateway:
    image: qsvc-auth:intranet
    entrypoint: ["node", "/opt/qsvc-trial/gateway.cjs"]
    user: "65534:65534"
    read_only: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./trial:/opt/qsvc-trial:ro
      - /var/lib/qsvc/onprem-trial:/trial:ro
  sfu:
    environment:
      NODE_OPTIONS: --require=/opt/qsvc-trial/stop-at-expiry.cjs
    volumes:
      - ./trial:/opt/qsvc-trial:ro
      - /var/lib/qsvc/onprem-trial:/trial:ro
  auth:
    environment:
      QSVC_AI_GATEWAY_ENABLED: ${QSVC_AI_GATEWAY_ENABLED:-false}
      QSVC_AI_GATEWAY_TOKEN: ${QSVC_AI_GATEWAY_TOKEN:-}
      QSVC_DEPLOYMENT: onprem
      QSVC_SSO_ENABLED: "false"
      QSVC_DIGILOCKER_ENABLED: "false"
      QSVC_GOOGLE_CLIENT_ID: ""
      QSVC_GOOGLE_CLIENT_SECRET: ""
      QSVC_MICROSOFT_CLIENT_ID: ""
      QSVC_MICROSOFT_CLIENT_SECRET: ""
      QSVC_EMAIL_API_KEY: ""
      PAYMENTS_ENABLED: "false"
      PAYMENT_TERMS_CONFIRMED: "false"
      JWT_EXPIRY: 1h
  signaling:
    volumes:
      - ./trial:/opt/qsvc-trial:ro
      - /var/lib/qsvc/onprem-trial:/trial:ro
    environment:
      NODE_OPTIONS: --require=/opt/qsvc-trial/stop-at-expiry.cjs
      QSVC_DEPLOYMENT: onprem
      ENABLE_ONPREM_GOOGLE_TRANSLATION: "false"
      GOOGLE_TRANSLATE_API_KEY: ""
      LIBRETRANSLATE_URL: ""
      ASR_URL: ""
      MINUTES_LLM_URL: ""
      QSVC_AI_GATEWAY_ENABLED: ${QSVC_AI_GATEWAY_ENABLED:-false}
      MINUTES_LLM_MODEL: ${QSVC_AI_MINUTES_MODEL:-}
      MINUTES_LLM_API_KEY: ${QSVC_AI_GATEWAY_TOKEN:-}
      MINUTES_TIMEOUT_MS: "11000"
  recording:
    environment:
      RECORDING_BUCKET: ""
