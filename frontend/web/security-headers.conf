add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Permissions-Policy 'camera=(self), microphone=(self), display-capture=(self), speaker-selection=(self), geolocation=(), payment=(self "https://api.razorpay.com" "https://sdk.cashfree.com"), usb=()' always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://checkout.razorpay.com https://sdk.cashfree.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' wss: https:; worker-src 'self' blob:; frame-src https://*.razorpay.com https://*.cashfree.com https://www.paypal.com https://www.sandbox.paypal.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
