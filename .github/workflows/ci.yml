name: QS-VC CI

on:
  workflow_call:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint-test-build:
    name: Lint → Test → Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Validate deployment security evidence and findings
        run: node --test security/check.test.cjs && node security/check.cjs

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install locked Poly bridge dependencies
        run: npm --prefix deploy/poly-bridge ci --ignore-scripts

      - name: Audit Poly bridge dependencies
        run: npm --prefix deploy/poly-bridge audit --omit=dev --audit-level=high

      - name: Type-check Poly bridge
        run: npm --prefix deploy/poly-bridge run typecheck

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Run tests
        run: npx vitest run --reporter=verbose

      - name: Build all services
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-test-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build SFU image
        uses: docker/build-push-action@v6
        with:
          context: services/sfu
          file: services/sfu/Dockerfile
          push: false
          load: true
          tags: qsvc-sfu:latest

      - name: Generate SFU image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: qsvc-sfu:latest
          format: cyclonedx-json
          output-file: qsvc-sfu.cdx.json
          artifact-name: qsvc-sfu.cdx.json

      - name: Scan SFU image SBOM
        uses: anchore/scan-action@v7
        with:
          sbom: qsvc-sfu.cdx.json
          fail-build: true
          severity-cutoff: high
          # Fail on high/critical findings that have a published fix; unfixed OS CVEs are tracked in the SBOM.
          only-fixed: true

      - name: Build Signaling image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/signaling/Dockerfile
          push: false
          load: true
          tags: qsvc-signaling:latest

      - name: Generate signaling image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: qsvc-signaling:latest
          format: cyclonedx-json
          output-file: qsvc-signaling.cdx.json
          artifact-name: qsvc-signaling.cdx.json

      - name: Scan signaling image SBOM
        uses: anchore/scan-action@v7
        with:
          sbom: qsvc-signaling.cdx.json
          fail-build: true
          severity-cutoff: high
          # Fail on high/critical findings that have a published fix; unfixed OS CVEs are tracked in the SBOM.
          only-fixed: true

      - name: Build Auth image
        uses: docker/build-push-action@v6
